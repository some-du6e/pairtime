# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The agent's local API: what the agent serves on 127.0.0.1 to the local
# dashboard and to local tools such as `pairtime doctor` (DESIGN 3.9; CP 6.3).
# web/ generates its TypeScript types from this file (SP 7.3), so a route or
# field changes here and in internal/agent in the same PR.
openapi: 3.1.0
info:
  title: pairtime agent, local API
  version: 0.2.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: |
    The agent listens on 127.0.0.1 only, on the port in port.json (7247 when
    it is free). Every request, the dashboard's files included, must come from
    a loopback address, carry a Host of `127.0.0.1:<port>` or
    `localhost:<port>`, and, when it has an Origin, have the dashboard's own
    (`http://127.0.0.1:<port>` or `http://localhost:<port>`). Anything else
    gets 403, which stops DNS rebinding and cross-site requests.

    The dashboard's static files at `/` need nothing more. Routes under
    `/v1/` also need one of two credentials. Local tools send the bearer
    token from port.json, which only the user who runs the agent can read.
    The dashboard sends the `pairtime_session` cookie instead. `pairtime
    dashboard` asks POST /v1/dashboard/link for a one-time URL and opens it
    in the teen's browser, and GET /signin sets the cookie, `SameSite=Strict`
    and `HttpOnly`, and sends the browser on to the dashboard (DESIGN 3.9).
    A request the cookie signs in that changes anything must also carry the
    dashboard's own Origin, which browsers send with every fetch that isn't
    a GET.
servers:
  - url: http://127.0.0.1:7247
    description: the default port; port.json has the real one
security:
  - bearer: []
  - session: []
paths:
  /v1/status:
    get:
      operationId: getStatus
      summary: What the running agent is doing
      description: >
        Read by `pairtime doctor`, footprint.yml and the dashboard. The
        answer is never cached.
      responses:
        "200":
          description: The agent's build, uptime, mode and scheduler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/agent/stop:
    post:
      operationId: stopAgent
      summary: Stop the agent
      description: >
        Answers first, then stops the agent the same way on every OS.
        Windows has no signal for a process without a console, and
        footprint.yml uses this to stop the agent cleanly.
      responses:
        "202":
          description: The agent is stopping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stopping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/days/{date}:
    get:
      operationId: getDay
      summary: One local day, project by project
      description: >
        The scorer's rollup of one local day in the profile's time zone
        (DESIGN 3.5 `days/`, SM 5.3), with a tally for each project that has
        anything in it. `pairtime today` and `pairtime statusline` read it
        (WP-CO0), and so does the dashboard, which asks for today about once a
        minute while it is open, so pending minutes turn final on the page.
        The agent answers from its day rollups, quickly enough for a status
        line, and the answer is never cached. Until WP-AG4's stores serve it,
        every day is empty.
      parameters:
        - name: date
          in: path
          required: true
          description: The day, `YYYY-MM-DD`, or `today`, which the agent resolves.
          schema:
            type: string
      responses:
        "200":
          description: The day's tallies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Day"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions/last:
    get:
      operationId: getLastSession
      summary: The most recent work session
      description: >
        The last work session (SM 5.3: credited minutes in one project, split
        where two are more than `SESSION_GAP_S` apart), or the one still
        going. `pairtime recap` reads it (WP-CO0), and so does the
        dashboard's Today page. Before the first session, `session` is null.
        The answer is never cached.
      responses:
        "200":
          description: The session, or null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LastSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/dashboard/link:
    post:
      operationId: dashboardLink
      summary: A one-time URL that signs a browser in to the dashboard
      description: >
        `pairtime dashboard` asks for one and opens it. The link works
        once, within `expires_in_s` seconds, and only on 127.0.0.1. Only the
        bearer token gets one, so a signed-in browser can't hand out more.
      security:
        - bearer: []
      responses:
        "201":
          description: A new link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /signin:
    get:
      operationId: signIn
      summary: Sign this browser in to the dashboard
      description: >
        The one-time URL from POST /v1/dashboard/link. A good code sets the
        session cookie and sends the browser to the dashboard. A used, old
        or wrong one sends it to `/?signin=expired`, where the dashboard
        says to run `pairtime dashboard` again. Either way the answer is a
        303 and never cached.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: The code POST /v1/dashboard/link put in the URL.
          schema:
            type: string
      responses:
        "303":
          description: >
            To `/` with a `Set-Cookie` for the session, or to
            `/?signin=expired` without one.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: >
                `pairtime_session=<id>; Path=/; HttpOnly; SameSite=Strict`,
                only for a good code. The session lasts until the agent
                stops, or until 8 hours pass with no request that uses it.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The `token` field of port.json, 32 random bytes in unpadded base64url.
    session:
      type: apiKey
      in: cookie
      name: pairtime_session
      description: >
        The dashboard's sign-in, which GET /signin sets: 32 random bytes in
        unpadded base64url. The agent keeps its sessions in memory only.
  responses:
    Unauthorized:
      description: The request had no bearer token or session cookie, or a wrong one.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer realm="pairtime"
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: >
        The request came from another computer, or its Host or Origin wasn't
        the agent's own, or the session cookie signed in a change without
        the dashboard's Origin.
      content:
        text/plain:
          schema:
            type: string
    BadRequest:
      description: A parameter isn't what the route takes; the text says which.
      content:
        text/plain:
          schema:
            type: string
    Unavailable:
      description: The agent couldn't read its stores; the text says why, for the teen.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [version, pid, started, uptime_s, mode, port, wakeups, jobs, ipc]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        pid:
          type: integer
          description: The agent's process id.
        started:
          type: string
          format: date-time
          description: When the agent started, in UTC.
        uptime_s:
          type: integer
          minimum: 0
          description: Whole seconds since `started`.
        mode:
          $ref: "#/components/schemas/Mode"
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port the agent listens on.
        wakeups:
          type: integer
          minimum: 0
          description: The scheduler's timer firings since the start.
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        ipc:
          $ref: "#/components/schemas/IPC"
        focus:
          $ref: "#/components/schemas/Focus"
        problems:
          type: object
          description: >
            What isn't working, keyed by where it comes from (`config`,
            `config-watch`, `state`, `port`, `ipc`), in words for the teen.
            Absent when nothing is wrong.
          additionalProperties:
            type: string
    Version:
      type: object
      additionalProperties: false
      required: [version, go_version, platform]
      properties:
        version:
          type: string
          description: The release, such as `v0.1.0`, or `dev`.
          examples: [v0.1.0, dev]
        commit:
          type: string
          description: The full git commit the binary was built from.
        date:
          type: string
          description: The commit or build time, RFC 3339 in UTC.
        modified:
          type: boolean
          description: The checkout had uncommitted changes.
        go_version:
          type: string
          examples: [go1.26.0]
        platform:
          type: string
          description: GOOS/GOARCH.
          examples: [windows/amd64, darwin/arm64, linux/amd64]
    Mode:
      type: string
      description: >
        Whether anything leaves the device (DESIGN 4.2). `local` uploads
        nothing, and it is the only mode until signing in exists (WP-SV3).
      enum: [local]
    Job:
      type: object
      additionalProperties: false
      required: [name, runs]
      properties:
        name:
          type: string
        every_s:
          type: number
          minimum: 0
          description: The job's period in seconds. Absent for a job that runs once.
        runs:
          type: integer
          minimum: 0
    IPC:
      type: object
      additionalProperties: false
      required: [stored, duplicates, refused]
      description: >
        The per-user socket hooks hand their messages to the agent on
        (DESIGN 3.3).
      properties:
        via:
          type: string
          enum: [socket, pipe]
          description: >
            `socket` for the AF_UNIX socket, or `pipe` for the named pipe
            Windows falls back to. Absent when hooks can't reach the agent and
            spool their messages instead.
        stored:
          type: integer
          minimum: 0
          description: >
            The messages the agent stored since it started, from the socket
            and the spool both.
        duplicates:
          type: integer
          minimum: 0
          description: Second copies of stored messages, which the agent dropped.
        refused:
          type: integer
          minimum: 0
          description: Connections turned away because they didn't come from this user.
    Focus:
      type: object
      additionalProperties: false
      required: [known]
      description: >
        Whether the agent can tell which window is in front (DESIGN 3.3,
        5.9). WP-AG6 adds it to the reply with the idle signal
        (D-design-5.9). While `known` is false the dashboard's Today page
        says D-focus-unknown's sentence, because time on such a desktop is
        level C (SM 2.5).
      properties:
        known:
          type: boolean
          description: False while the desktop doesn't say which window is in front.
        via:
          type: string
          description: The focus source, when there is one, such as `SetWinEventHook`.
        gnome_extension:
          type: string
          enum: [needs_login, unticked]
          description: >
            On GNOME, why pairtime's Shell extension isn't reporting:
            `needs_login` until the teen logs out and back in once after
            install, `unticked` when install left it out. Absent elsewhere.
    Stopping:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: stopping
    DashboardLink:
      type: object
      additionalProperties: false
      required: [url, expires_in_s]
      properties:
        url:
          type: string
          description: >
            `http://127.0.0.1:<port>/signin?code=<code>`, where the code is 32
            random bytes in unpadded base64url.
        expires_in_s:
          type: integer
          minimum: 1
          description: How long the link works, in seconds.
    Day:
      type: object
      additionalProperties: false
      required: [date, shadow, projects]
      description: One local day, as GET /v1/days/{date} gives it.
      properties:
        date:
          type: string
          format: date
          description: The day. Asked for `today`, the agent says which day that is.
        shadow:
          $ref: "#/components/schemas/Shadow"
        projects:
          type: array
          description: A tally for each project with anything in it that day.
          items:
            $ref: "#/components/schemas/DayProject"
    DayProject:
      type: object
      additionalProperties: false
      required: [project, name, credited_s, pending_s, credited_by_kind, credited_by_evidence, agent_only_s, agent_only_by_harness, uncredited]
      description: One project's tally over a day (SM 5.1, 5.3). Seconds may be halves.
      properties:
        project:
          type: string
          description: The project's opaque key (AGENTS.md).
        name:
          $ref: "#/components/schemas/ProjectName"
        credited_s:
          $ref: "#/components/schemas/CreditedS"
        pending_s:
          $ref: "#/components/schemas/PendingS"
        credited_by_kind:
          $ref: "#/components/schemas/ByKind"
        credited_by_evidence:
          $ref: "#/components/schemas/ByEvidence"
        agent_only_s:
          $ref: "#/components/schemas/AgentOnlyS"
        agent_only_by_harness:
          $ref: "#/components/schemas/AgentOnlyByHarness"
        uncredited:
          $ref: "#/components/schemas/Uncredited"
    LastSession:
      type: object
      additionalProperties: false
      required: [shadow, session]
      properties:
        shadow:
          $ref: "#/components/schemas/Shadow"
        session:
          $ref: "#/components/schemas/WorkSession"
    WorkSession:
      type: [object, "null"]
      additionalProperties: false
      required: [project, name, start, end, open, credited_s, pending_s, credited_by_kind, credited_by_evidence, agent_only_s, agent_only_by_harness, uncredited]
      description: >
        A work session (SM 5.3) with the same tally as a project's day, or
        null before the first one.
      properties:
        project:
          type: string
          description: The project's opaque key (AGENTS.md).
        name:
          $ref: "#/components/schemas/ProjectName"
        start:
          type: string
          format: date-time
          description: The session's first credited second, in UTC.
        end:
          type: string
          format: date-time
          description: Its last credited second so far, in UTC.
        open:
          type: boolean
          description: >
            The session is still going: no `SESSION_GAP_S` without credit since
            `end`, and no lock or suspend (DESIGN 3.8).
        credited_s:
          $ref: "#/components/schemas/CreditedS"
        pending_s:
          $ref: "#/components/schemas/PendingS"
        credited_by_kind:
          $ref: "#/components/schemas/ByKind"
        credited_by_evidence:
          $ref: "#/components/schemas/ByEvidence"
        agent_only_s:
          $ref: "#/components/schemas/AgentOnlyS"
        agent_only_by_harness:
          $ref: "#/components/schemas/AgentOnlyByHarness"
        uncredited:
          $ref: "#/components/schemas/Uncredited"
    Shadow:
      type: boolean
      description: >
        `display.shadow` (DESIGN 6.7 step 2). While it is on, every view shows
        your time as "calibrating" and keeps the agent's time.
    ProjectName:
      type: string
      description: >
        The project's display name from the local project map: its
        repository's folder name, or the name the teen gave it. Like everything
        this API serves, it stays on this computer. Empty when the map has
        none, and then the views show the key.
    CreditedS:
      type: number
      minimum: 0
      description: Credited seconds, your time, pending minutes included.
    PendingS:
      type: number
      minimum: 0
      description: >
        The part of `credited_s` in minutes that are still pending (DESIGN
        3.7), which late records may change.
    AgentOnlyS:
      type: number
      minimum: 0
      description: >
        SM 5.3's `agent_only_s`: the seconds an agent turn in the project ran
        and nothing credited, whatever their reason code. The agent's side of
        the chess clock (DESIGN 3.8).
    ByKind:
      type: object
      additionalProperties: false
      description: >
        `credited_s` by activity kind (SM 5.1), pending minutes included. A
        kind with no seconds may be left out.
      properties:
        prompting:
          type: number
          minimum: 0
        reading_output:
          type: number
          minimum: 0
        supervising:
          type: number
          minimum: 0
        reviewing:
          type: number
          minimum: 0
        testing:
          type: number
          minimum: 0
        debugging:
          type: number
          minimum: 0
        hand_edit:
          type: number
          minimum: 0
        lookup:
          type: number
          minimum: 0
    ByEvidence:
      type: object
      additionalProperties: false
      description: >
        `credited_s` by evidence level (SM 5.1, DESIGN 6.4), pending minutes
        included at the level they have so far. A level with no seconds may be
        left out.
      properties:
        A:
          type: number
          minimum: 0
        B:
          type: number
          minimum: 0
        C:
          type: number
          minimum: 0
    AgentOnlyByHarness:
      type: object
      additionalProperties: false
      description: >
        `agent_only_s` by the harness whose turn ran (SM 1.1). It lists every
        harness that had a session in the project in the span, with 0 for one
        that had no time on its own, so the views can name the agent whose
        answers were read: "reading Claude's answers".
      properties:
        claude_code:
          type: number
          minimum: 0
        cursor:
          type: number
          minimum: 0
        copilot:
          type: number
          minimum: 0
        codex:
          type: number
          minimum: 0
        gemini:
          type: number
          minimum: 0
        devin:
          type: number
          minimum: 0
        cline:
          type: number
          minimum: 0
        opencode:
          type: number
          minimum: 0
        other:
          type: number
          minimum: 0
    Uncredited:
      type: object
      additionalProperties: false
      description: >
        The project's seconds pairtime looked at and didn't credit, by
        reason code (SM 5.2). Agent-only seconds are in it too, under their
        own codes, such as `X.agent_only`. A reason with no seconds may be
        left out.
      properties:
        X.absent:
          type: number
          minimum: 0
        X.other_focus:
          type: number
          minimum: 0
        X.ambiguous:
          type: number
          minimum: 0
        X.no_anchor:
          type: number
          minimum: 0
        X.agent_only:
          type: number
          minimum: 0
        X.automated:
          type: number
          minimum: 0
        X.no_input:
          type: number
          minimum: 0
        X.reroll:
          type: number
          minimum: 0
        X.rewrite_loop:
          type: number
          minimum: 0
        X.same_error:
          type: number
          minimum: 0
        X.autopilot:
          type: number
          minimum: 0
        X.noprog:
          type: number
          minimum: 0
        X.lookup_cap:
          type: number
          minimum: 0
        X.bucket_cap:
          type: number
          minimum: 0
        X.day_cap:
          type: number
          minimum: 0
