# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The agent's local API: what the agent serves on 127.0.0.1 to the local
# dashboard and to local tools such as `pairtime doctor` (DESIGN 3.9; CP 6.3).
# web/ generates its TypeScript types from this file (SP 7.3), so a route or
# field changes here and in internal/agent in the same PR.
openapi: 3.1.0
info:
  title: pairtime agent, local API
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: |
    The agent listens on 127.0.0.1 only, on the port in port.json (7247 when
    it is free). Every request, the dashboard's files included, must come from
    a loopback address, carry a Host of `127.0.0.1:<port>` or
    `localhost:<port>`, and, when it has an Origin, have the dashboard's own
    (`http://127.0.0.1:<port>` or `http://localhost:<port>`). Anything else
    gets 403, which stops DNS rebinding and cross-site requests.

    The dashboard's static files at `/` need nothing more. Routes under
    `/v1/` also need the bearer token from port.json, which only the user who
    runs the agent can read. The dashboard's own sign-in, a one-time URL that
    sets a `SameSite=Strict`, `HttpOnly` cookie, comes with WP-UI1. Until
    then the dashboard calls GET /v1/status with no token, gets 401, and
    says this version can't open it yet.
servers:
  - url: http://127.0.0.1:7247
    description: the default port; port.json has the real one
security:
  - bearer: []
paths:
  /v1/status:
    get:
      operationId: getStatus
      summary: What the running agent is doing
      description: >
        Read by `pairtime doctor`, footprint.yml and the dashboard. The
        answer is never cached.
      responses:
        "200":
          description: The agent's build, uptime, mode and scheduler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/days/{date}:
    get:
      operationId: getDay
      summary: One local day of this device, by project
      description: >
        What `pairtime today` and `statusline` print and the dashboard's
        Today page shows (DESIGN 3.8): for each project with anything in the
        day, your time by activity kind and by evidence level, the agent's
        time on its own by harness, and the time that wasn't credited, by
        reason (SM 5.2, 5.3). The day is the device's local day. The answer
        comes from the day's rollup in `days/`, which the scorer rewrites
        each time one of the day's minute buckets changes, every 60 s while
        anything is recorded (DESIGN 3.5, 3.7). While `shadow` is true a
        project shows the agent's time and SM 4.2's loops alone (`Shadow`).
        The answer is never cached.
      parameters:
        - name: date
          in: path
          required: true
          description: A day as YYYY-MM-DD, or `today` for today in the device's time zone.
          schema:
            type: string
          examples:
            today:
              value: today
            date:
              value: "2026-11-24"
      responses:
        "200":
          description: The day's rollup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Day"
        "400":
          description: The date isn't YYYY-MM-DD or `today`.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sessions/last:
    get:
      operationId: getLastSession
      summary: The last work session, or the one still going
      description: >
        What `pairtime recap` prints: the most recent work session (SM 5.3),
        a run of one project's credited minutes split where one ends more
        than SESSION_GAP_S (1,200 s) before the next starts, with the same
        tally as a day. `session` is null before the first. While `shadow`
        is true a session is its date and project, the agent's time and
        SM 4.2's loops (`Shadow`). The agent gives the same JSON to the
        CLI's `sessions/last` question over its socket, which `pairtime
        recap` asks. The answer is never cached.
      responses:
        "200":
          description: The last work session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LastSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/agent/stop:
    post:
      operationId: stopAgent
      summary: Stop the agent
      description: >
        Answers first, then stops the agent the same way on every OS.
        Windows has no signal for a process without a console, and
        footprint.yml uses this to stop the agent cleanly.
      responses:
        "202":
          description: The agent is stopping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stopping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The `token` field of port.json, 32 random bytes in unpadded base64url.
  responses:
    Unauthorized:
      description: The request had no bearer token, or the wrong one.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer realm="pairtime"
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: >
        The request came from another computer, or its Host or Origin wasn't
        the agent's own.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [version, pid, started, uptime_s, mode, port, wakeups, jobs, ipc, signals, adapters]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        pid:
          type: integer
          description: The agent's process id.
        started:
          type: string
          format: date-time
          description: When the agent started, in UTC.
        uptime_s:
          type: integer
          minimum: 0
          description: Whole seconds since `started`.
        mode:
          $ref: "#/components/schemas/Mode"
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port the agent listens on.
        wakeups:
          type: integer
          minimum: 0
          description: The scheduler's timer firings since the start.
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        ipc:
          $ref: "#/components/schemas/IPC"
        signals:
          $ref: "#/components/schemas/Signals"
        adapters:
          $ref: "#/components/schemas/Adapters"
        problems:
          type: object
          description: >
            What isn't working, keyed by where it comes from (`config`,
            `config-watch`, `state`, `port`, `ipc`, `presence`, `focus`,
            `ledger`, `scorer`), in
            words for the teen. Absent when nothing is wrong.
          additionalProperties:
            type: string
    Version:
      type: object
      additionalProperties: false
      required: [version, go_version, platform]
      properties:
        version:
          type: string
          description: The release, such as `v0.1.0`, or `dev`.
          examples: [v0.1.0, dev]
        commit:
          type: string
          description: The full git commit the binary was built from.
        date:
          type: string
          description: The commit or build time, RFC 3339 in UTC.
        modified:
          type: boolean
          description: The checkout had uncommitted changes.
        go_version:
          type: string
          examples: [go1.26.0]
        platform:
          type: string
          description: GOOS/GOARCH.
          examples: [windows/amd64, darwin/arm64, linux/amd64]
    Mode:
      type: string
      description: >
        Whether anything leaves the device (DESIGN 4.2). `local` uploads
        nothing. `online` uploads the tier-1 numbers of DESIGN 4.3 to the
        server `pairtime login` linked, and `pairtime logout` goes back to
        `local` (WP-SV3).
      enum: [local, online]
    Job:
      type: object
      additionalProperties: false
      required: [name, runs]
      properties:
        name:
          type: string
        every_s:
          type: number
          minimum: 0
          description: The job's period in seconds. Absent for a job that runs once.
        runs:
          type: integer
          minimum: 0
    IPC:
      type: object
      additionalProperties: false
      required: [stored, duplicates, refused]
      description: >
        The per-user socket hooks hand their messages to the agent on
        (DESIGN 3.3).
      properties:
        via:
          type: string
          enum: [socket, pipe]
          description: >
            `socket` for the AF_UNIX socket, or `pipe` for the named pipe
            Windows falls back to. Absent when hooks can't reach the agent and
            spool their messages instead.
        stored:
          type: integer
          minimum: 0
          description: >
            The messages the agent stored since it started, from the socket
            and the spool both.
        duplicates:
          type: integer
          minimum: 0
          description: Second copies of stored messages, which the agent dropped.
        refused:
          type: integer
          minimum: 0
          description: Connections turned away because they didn't come from this user.
    Adapters:
      type: object
      additionalProperties: false
      required: [harnesses, other, waiting, git]
      description: >
        What the harness adapters made of the hook calls the agent stored
        since it started, and what the git adapter watches (DESIGN 3.4, 5.3,
        5.8). The dashboard's list of adapters shows each one's last record
        and parse failures, so a broken parser shows instead of crediting
        less without a word.
      properties:
        harnesses:
          type: object
          description: The counts of each harness pairtime has an adapter for, by its name.
          additionalProperties:
            $ref: "#/components/schemas/HarnessCounts"
        other:
          $ref: "#/components/schemas/HarnessCounts"
        waiting:
          type: integer
          minimum: 0
          description: >
            Calls that wait to be parsed: for the device key and the ledger to
            open, in memory and in held.jsonl, or for the git adapter to work
            out their folder's project.
        dropped:
          type: integer
          minimum: 0
          description: Calls lost because held.jsonl was full. Absent when none.
        git:
          $ref: "#/components/schemas/Git"
    HarnessCounts:
      type: object
      additionalProperties: false
      required: [calls, records, parse_failures]
      properties:
        calls:
          type: integer
          minimum: 0
        records:
          type: integer
          minimum: 0
          description: The ledger records the calls made.
        parse_failures:
          type: integer
          minimum: 0
          description: >
            Calls the adapter couldn't fully read: unknown events or fields, a
            payload that isn't JSON, a call cut short. Their other records are
            still written.
        write_failures:
          type: integer
          minimum: 0
          description: Records the ledger refused. Absent when none.
        ignored:
          type: integer
          minimum: 0
          description: Calls from a folder a .pairtime-ignore keeps out, which make no record. Absent when none.
        last_record:
          type: integer
          description: The time of the newest record, in Unix milliseconds. Absent before the first.
        last_failure:
          type: string
          description: What the last failure was, naming events and fields but never their values.
    Git:
      type: object
      additionalProperties: false
      required: [watched, changes]
      properties:
        watched:
          type: integer
          minimum: 0
          description: The worktrees sessions worked in since the agent started whose reflog the git adapter has read.
        changes:
          type: integer
          minimum: 0
          description: The git.change records written since the agent started.
    Signals:
      type: object
      additionalProperties: false
      required: [idle, focus, power, lock]
      description: >
        Where the running agent reads idle time, focus, suspend and resume,
        and the lock state, or why each is unknown (DESIGN 3.3). `pairtime
        doctor` prints its idle and focus lines from this, so they say what
        the agent reads, not what the terminal doctor runs in can reach
        (DESIGN 5.9). Each is its source on Windows (WP-OS1, WP-OS2), the
        macOS notification loop's on macOS, and the desktop's on Linux
        (WP-OS9).
      properties:
        idle:
          $ref: "#/components/schemas/Signal"
        focus:
          $ref: "#/components/schemas/Signal"
        power:
          $ref: "#/components/schemas/Signal"
        lock:
          $ref: "#/components/schemas/Signal"
        session:
          type: string
          enum: [x11, wayland, none]
          description: The kind of desktop session, on Linux only.
        loop:
          $ref: "#/components/schemas/Loop"
    Signal:
      type: object
      additionalProperties: false
      description: >
        Exactly one of `via` and `unknown` is set. A signal with a source
        can still fail now and then; `problems` says when it does.
      properties:
        via:
          type: string
          description: >
            The source, such as `GetLastInputInfo`, `MIT-SCREEN-SAVER` or
            `logind PrepareForSleep`, in words for doctor.
        unknown:
          type: string
          description: >
            Why the agent has no source, such as a Wayland desktop that tells
            other programs nothing about focus, in words for doctor.
    Loop:
      type: object
      additionalProperties: false
      required: [main_thread, dropped]
      description: >
        The macOS notification loop, which gives the agent sleep, wake,
        screen lock and app activation notifications, on macOS only and once
        it runs.
      properties:
        main_thread:
          type: boolean
          description: >
            The loop runs on the process's main thread, where macOS delivers
            screen lock and app switch notifications. When it doesn't,
            locks and app switches may not arrive.
        dropped:
          type: integer
          minimum: 0
          description: Events lost because the agent fell behind.
    Stopping:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: stopping
    Day:
      type: object
      additionalProperties: false
      required: [date, zone, start, end, shadow, projects]
      properties:
        date:
          type: string
          description: The day, as YYYY-MM-DD. Asked for `today`, the agent says which day that is.
          examples: ["2026-11-24"]
        zone:
          type: string
          description: The name of the time zone the day is counted in, as the device's clock gives it.
          examples: [Local]
        start:
          type: string
          format: date-time
          description: The start of the day, in UTC.
        end:
          type: string
          format: date-time
          description: The end of the day, in UTC. A day is 23 or 25 hours long where the clocks change.
        shadow:
          $ref: "#/components/schemas/Shadow"
        projects:
          type: array
          description: A row for each project with credit, agent time or uncredited time in the day, in project key order.
          items:
            $ref: "#/components/schemas/DayProject"
    DayProject:
      type: object
      additionalProperties: false
      required: [project, name, agent_only_s, agent_only_by_harness, uncredited]
      properties:
        project:
          type: string
          description: The project's opaque key.
        name:
          type: string
          description: >
            The project's name from the local project map, which never leaves
            the device. Empty until there is one; views show the key then.
        credited_s:
          type: number
          minimum: 0
          description: Your time, in seconds. Absent while `shadow` is true.
        pending_s:
          type: number
          minimum: 0
          description: >
            The part of `credited_s` in minutes that are still pending, which
            later records can change (DESIGN 3.7). Absent while `shadow` is
            true.
        credited_by_kind:
          $ref: "#/components/schemas/ByKind"
        credited_by_evidence:
          $ref: "#/components/schemas/ByEvidence"
        credited_by_reason:
          $ref: "#/components/schemas/ByReason"
        agent_only_s:
          type: number
          minimum: 0
          description: >
            SM 5.3's `agent_only_s` for the project: the seconds this
            project's agent turns ran that this project didn't credit,
            including seconds credited to another project (SM 6.3;
            testdata/timelines/6.3 `agent_only_s.<project>`).
        agent_only_by_harness:
          type: object
          description: >
            `agent_only_s` by the harness whose turn ran, such as
            `claude_code`, with every harness that had a session in the
            project in the span, at 0 when it had no time on its own.
          additionalProperties:
            type: number
            minimum: 0
        uncredited:
          $ref: "#/components/schemas/Uncredited"
        on_hold_s:
          $ref: "#/components/schemas/OnHold"
    LastSession:
      type: object
      additionalProperties: false
      required: [shadow, session]
      properties:
        shadow:
          $ref: "#/components/schemas/Shadow"
        session:
          description: The last work session, or null before the first.
          type: [object, "null"]
          additionalProperties: false
          required: [project, name, date, agent_only_s, agent_only_by_harness, uncredited]
          properties:
            project:
              type: string
              description: The session's project key.
            name:
              type: string
              description: The project's name from the local project map, or empty.
            date:
              type: string
              description: >
                The local day the session started on, YYYY-MM-DD, in the
                device's time zone: the day its first credited minute starts
                in. It is there whether or not `shadow` is true, and while it
                is, it is all the session says of when it was.
              examples: ["2026-11-24"]
            start:
              type: string
              format: date-time
              description: >
                The start of the session's first credited minute, in UTC.
                Absent while `shadow` is true.
            end:
              type: string
              format: date-time
              description: >
                The end of its last credited minute, in UTC. Absent while
                `shadow` is true.
            open:
              type: boolean
              description: >
                True while the session goes on: SESSION_GAP_S hasn't passed
                since `end`, and no lock or suspend came after its credit
                stopped (DESIGN 3.8). Absent while `shadow` is true, since
                whether the session goes on says whether its last minute
                counted.
            credited_s:
              type: number
              minimum: 0
              description: Your time, in seconds. Absent while `shadow` is true.
            pending_s:
              type: number
              minimum: 0
              description: >
                The part of `credited_s` in minutes that are still pending, which
                later records can change (DESIGN 3.7). Absent while `shadow` is
                true.
            credited_by_kind:
              $ref: "#/components/schemas/ByKind"
            credited_by_evidence:
              $ref: "#/components/schemas/ByEvidence"
            credited_by_reason:
              $ref: "#/components/schemas/ByReason"
            agent_only_s:
              type: number
              minimum: 0
              description: >
                SM 5.3's `agent_only_s` for the project: the seconds this
                project's agent turns ran that this project didn't credit,
                including seconds credited to another project (SM 6.3;
                testdata/timelines/6.3 `agent_only_s.<project>`).
            agent_only_by_harness:
              type: object
              description: >
                `agent_only_s` by the harness whose turn ran, such as
                `claude_code`, with every harness that had a session in the
                project in the span, at 0 when it had no time on its own.
              additionalProperties:
                type: number
                minimum: 0
            uncredited:
              $ref: "#/components/schemas/Uncredited"
            on_hold_s:
              $ref: "#/components/schemas/OnHold"
    Shadow:
      type: boolean
      description: >
        `display.shadow` in config.toml (DESIGN 6.7 step 2). While it is
        true, a tally shows only the agent's time (`agent_only_s`,
        `agent_only_by_harness`) and SM 4.2's loops in `uncredited`
        (`X.reroll`, `X.rewrite_loop`, `X.same_error`, `X.autopilot`). It
        leaves out your time and its splits (`credited_s`, `pending_s`,
        `credited_by_kind`, `credited_by_evidence`, `credited_by_reason`),
        `on_hold_s`, every other uncredited code, `X.day_cap` included, and
        a session's `start`, `end` and `open`, because with any of them your
        time could be worked back out (decision D-shadow-scope). Views read a
        missing number as 0 and a missing map as empty, and show your time
        as "calibrating", so nobody learns to steer the rules before they
        are fitted (SM 7.5). The files in `days/` and `buckets/` keep every
        number.
    Uncredited:
      type: object
      description: >
        Seconds that were looked at and not credited, by reason code (SM
        5.2), such as `X.absent`, and credit past the day's cap under
        `X.day_cap`. Agent-only seconds that no project credited are in it
        under their own codes; those another project credited aren't (SM
        6.3). While `shadow` is true it holds SM 4.2's loop codes alone.
      additionalProperties:
        type: number
        minimum: 0
    OnHold:
      type: number
      minimum: 0
      description: >
        The part of `uncredited`'s `X.noprog` in minutes still pending or
        provisional (SM 4.3, 5.1), which progress within PROGRESS_RESTORE_S
        can still bring back. Absent means 0. Absent while `shadow` is true.
    ByReason:
      type: object
      description: >
        Credited seconds by SM 5.2's credit code, with its `~r` and
        `+restored` suffixes, such as `READ~r` (SM 5.3), only the codes with
        credit. Absent while `shadow` is true.
      additionalProperties:
        type: number
        minimum: 0
    ByKind:
      type: object
      additionalProperties: false
      description: >
        Credited seconds by activity kind (SM 5.1), only the kinds with
        credit. Absent while `shadow` is true.
      properties:
        prompting:
          type: number
          minimum: 0
        reading_output:
          type: number
          minimum: 0
        supervising:
          type: number
          minimum: 0
        reviewing:
          type: number
          minimum: 0
        testing:
          type: number
          minimum: 0
        debugging:
          type: number
          minimum: 0
        hand_edit:
          type: number
          minimum: 0
        lookup:
          type: number
          minimum: 0
    ByEvidence:
      type: object
      additionalProperties: false
      description: >
        Credited seconds by evidence level (DESIGN 6.4), only the levels with
        credit. Absent while `shadow` is true.
      properties:
        A:
          type: number
          minimum: 0
        B:
          type: number
          minimum: 0
        C:
          type: number
          minimum: 0
