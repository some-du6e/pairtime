# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The agent's local API: what the agent serves on 127.0.0.1 to the local
# dashboard and to local tools such as `pairtime doctor` (DESIGN 3.9; CP 6.3).
# web/ generates its TypeScript types from this file (SP 7.3), so a route or
# field changes here and in internal/agent in the same PR.
openapi: 3.1.0
info:
  title: pairtime agent, local API
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: |
    The agent listens on 127.0.0.1 only, on the port in port.json (7247 when
    it is free). Every request, the dashboard's files included, must come from
    a loopback address, carry a Host of `127.0.0.1:<port>` or
    `localhost:<port>`, and, when it has an Origin, have the dashboard's own
    (`http://127.0.0.1:<port>` or `http://localhost:<port>`). Anything else
    gets 403, which stops DNS rebinding and cross-site requests.

    The dashboard's static files at `/` need nothing more. Routes under
    `/v1/` also need the bearer token from port.json, which only the user who
    runs the agent can read. The dashboard's own sign-in, a one-time URL that
    sets a `SameSite=Strict`, `HttpOnly` cookie, comes with WP-UI1. Until
    then the dashboard calls GET /v1/status with no token, gets 401, and
    says this version can't open it yet.
servers:
  - url: http://127.0.0.1:7247
    description: the default port; port.json has the real one
security:
  - bearer: []
paths:
  /v1/status:
    get:
      operationId: getStatus
      summary: What the running agent is doing
      description: >
        Read by `pairtime doctor`, footprint.yml and the dashboard. The
        answer is never cached.
      responses:
        "200":
          description: The agent's build, uptime, mode and scheduler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/today:
    get:
      operationId: getToday
      summary: This device's time today, by project and evidence level
      description: >
        The first thing the dashboard and `pairtime today` show (DESIGN 3.8):
        today's credited seconds per project and per evidence level, the
        agent's time per project, and what wasn't credited. Today is the
        device's local day (SM 5.3). The numbers sum the latest revision of
        each minute's bucket, which the scorer writes every 60 s while
        anything is recorded (DESIGN 3.7). A minute is pending until
        `final_before` passes its end, and the part of the credit in pending
        minutes, which later records can still change, is `pending_s`. While
        `shadow` is true the reply leaves out every credited and uncredited
        number and keeps the agent's time (DESIGN 6.7). The answer is never
        cached.
      responses:
        "200":
          description: Today's rollup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Today"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/agent/stop:
    post:
      operationId: stopAgent
      summary: Stop the agent
      description: >
        Answers first, then stops the agent the same way on every OS.
        Windows has no signal for a process without a console, and
        footprint.yml uses this to stop the agent cleanly.
      responses:
        "202":
          description: The agent is stopping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stopping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The `token` field of port.json, 32 random bytes in unpadded base64url.
  responses:
    Unauthorized:
      description: The request had no bearer token, or the wrong one.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer realm="pairtime"
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: >
        The request came from another computer, or its Host or Origin wasn't
        the agent's own.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [version, pid, started, uptime_s, mode, port, wakeups, jobs, ipc]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        pid:
          type: integer
          description: The agent's process id.
        started:
          type: string
          format: date-time
          description: When the agent started, in UTC.
        uptime_s:
          type: integer
          minimum: 0
          description: Whole seconds since `started`.
        mode:
          $ref: "#/components/schemas/Mode"
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port the agent listens on.
        wakeups:
          type: integer
          minimum: 0
          description: The scheduler's timer firings since the start.
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        ipc:
          $ref: "#/components/schemas/IPC"
        problems:
          type: object
          description: >
            What isn't working, keyed by where it comes from (`config`,
            `config-watch`, `state`, `port`, `ipc`, `ledger`, `scorer`), in
            words for the teen. Absent when nothing is wrong.
          additionalProperties:
            type: string
    Version:
      type: object
      additionalProperties: false
      required: [version, go_version, platform]
      properties:
        version:
          type: string
          description: The release, such as `v0.1.0`, or `dev`.
          examples: [v0.1.0, dev]
        commit:
          type: string
          description: The full git commit the binary was built from.
        date:
          type: string
          description: The commit or build time, RFC 3339 in UTC.
        modified:
          type: boolean
          description: The checkout had uncommitted changes.
        go_version:
          type: string
          examples: [go1.26.0]
        platform:
          type: string
          description: GOOS/GOARCH.
          examples: [windows/amd64, darwin/arm64, linux/amd64]
    Mode:
      type: string
      description: >
        Whether anything leaves the device (DESIGN 4.2). `local` uploads
        nothing, and it is the only mode until signing in exists (WP-SV3).
      enum: [local]
    Job:
      type: object
      additionalProperties: false
      required: [name, runs]
      properties:
        name:
          type: string
        every_s:
          type: number
          minimum: 0
          description: The job's period in seconds. Absent for a job that runs once.
        runs:
          type: integer
          minimum: 0
    IPC:
      type: object
      additionalProperties: false
      required: [stored, duplicates, refused]
      description: >
        The per-user socket hooks hand their messages to the agent on
        (DESIGN 3.3).
      properties:
        via:
          type: string
          enum: [socket, pipe]
          description: >
            `socket` for the AF_UNIX socket, or `pipe` for the named pipe
            Windows falls back to. Absent when hooks can't reach the agent and
            spool their messages instead.
        stored:
          type: integer
          minimum: 0
          description: >
            The messages the agent stored since it started, from the socket
            and the spool both.
        duplicates:
          type: integer
          minimum: 0
          description: Second copies of stored messages, which the agent dropped.
        refused:
          type: integer
          minimum: 0
          description: Connections turned away because they didn't come from this user.
    Stopping:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: stopping
    Today:
      type: object
      additionalProperties: false
      required: [date, zone, start, end, shadow, agent_running_s, projects, minutes, pending_minutes]
      properties:
        date:
          type: string
          description: Today in the device's time zone, as YYYY-MM-DD.
          examples: ["2026-11-20"]
        zone:
          type: string
          description: The name of the time zone the day is counted in, as the device's clock gives it.
          examples: [Local]
        start:
          type: string
          format: date-time
          description: The start of the day, in UTC.
        end:
          type: string
          format: date-time
          description: The end of the day, in UTC. A day is 23 or 25 hours long where the clocks change.
        shadow:
          type: boolean
          description: >
            `display.shadow` in config.toml. While it is true, the credited and
            uncredited numbers are left out, and views show credited time as
            "calibrating".
        credited_s:
          type: number
          minimum: 0
          description: Your time today, in seconds. Absent while `shadow` is true.
        pending_s:
          type: number
          minimum: 0
          description: The part of `credited_s` in minutes that are still pending. Absent while `shadow` is true.
        by_level:
          $ref: "#/components/schemas/ByLevel"
        uncredited:
          type: object
          description: >
            Seconds that were looked at and not credited, by reason code (SM
            5.2), such as `X.no_anchor`. Absent when there were none, and while
            `shadow` is true.
          additionalProperties:
            type: number
            minimum: 0
        agent_running_s:
          type: number
          minimum: 0
          description: Seconds an agent ran today, in any project.
        projects:
          type: array
          description: One row for each project with credit or agent time today, in project key order.
          items:
            $ref: "#/components/schemas/TodayProject"
        final_before:
          type: string
          format: date-time
          description: >
            Every minute before this time is final and won't change again.
            Absent before the scorer has scored anything.
        minutes:
          type: integer
          minimum: 0
          description: Today's minutes in which anything was credited or an agent ran.
        pending_minutes:
          type: integer
          minimum: 0
          description: How many of `minutes` are still pending.
    TodayProject:
      type: object
      additionalProperties: false
      required: [project_key, agent_s, agent_only_s]
      properties:
        project_key:
          type: string
          description: The project's opaque key. Names come with the project map.
        credited_s:
          type: number
          minimum: 0
          description: Your time in the project today, in seconds. Absent while `shadow` is true.
        pending_s:
          type: number
          minimum: 0
          description: The part of `credited_s` in pending minutes. Absent while `shadow` is true.
        by_level:
          $ref: "#/components/schemas/ByLevel"
        by_kind:
          $ref: "#/components/schemas/ByKind"
        agent_s:
          type: integer
          minimum: 0
          description: Seconds a turn of an agent ran in the project today.
        agent_only_s:
          type: integer
          minimum: 0
          description: The part of `agent_s` that nothing credited you for (SM 2.6).
    ByLevel:
      type: object
      additionalProperties: false
      description: >
        Credited seconds by evidence level (DESIGN 6.4), each level present.
        Absent while `shadow` is true.
      required: [A, B, C]
      properties:
        A:
          type: number
          minimum: 0
        B:
          type: number
          minimum: 0
        C:
          type: number
          minimum: 0
    ByKind:
      type: object
      additionalProperties: false
      description: Credited seconds by activity kind (SM 5.1). Absent while `shadow` is true.
      properties:
        prompting:
          type: number
          minimum: 0
        reading_output:
          type: number
          minimum: 0
        supervising:
          type: number
          minimum: 0
        reviewing:
          type: number
          minimum: 0
        testing:
          type: number
          minimum: 0
        debugging:
          type: number
          minimum: 0
        hand_edit:
          type: number
          minimum: 0
        lookup:
          type: number
          minimum: 0
