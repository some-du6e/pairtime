# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The agent's local API: what the agent serves on 127.0.0.1 to the local
# dashboard and to local tools such as `pairtime doctor` (DESIGN 3.9; CP 6.3).
# web/ generates its TypeScript types from this file (SP 7.3), so a route or
# field changes here and in internal/agent in the same PR.
openapi: 3.1.0
info:
  title: pairtime agent, local API
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: |
    The agent listens on 127.0.0.1 only, on the port in port.json (7247 when
    it is free). Every request, the dashboard's files included, must come from
    a loopback address, carry a Host of `127.0.0.1:<port>` or
    `localhost:<port>`, and, when it has an Origin, have the dashboard's own
    (`http://127.0.0.1:<port>` or `http://localhost:<port>`). Anything else
    gets 403, which stops DNS rebinding and cross-site requests.

    The dashboard's static files at `/` need nothing more. Routes under
    `/v1/` also need the bearer token from port.json, which only the user who
    runs the agent can read. The dashboard's own sign-in, a one-time URL that
    sets a `SameSite=Strict`, `HttpOnly` cookie, comes with WP-UI1. Until
    then the dashboard calls GET /v1/status with no token, gets 401, and
    says this version can't open it yet.
servers:
  - url: http://127.0.0.1:7247
    description: the default port; port.json has the real one
security:
  - bearer: []
paths:
  /v1/status:
    get:
      operationId: getStatus
      summary: What the running agent is doing
      description: >
        Read by `pairtime doctor`, footprint.yml and the dashboard. The
        answer is never cached.
      responses:
        "200":
          description: The agent's build, uptime, mode and scheduler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/agent/stop:
    post:
      operationId: stopAgent
      summary: Stop the agent
      description: >
        Answers first, then stops the agent the same way on every OS.
        Windows has no signal for a process without a console, and
        footprint.yml uses this to stop the agent cleanly.
      responses:
        "202":
          description: The agent is stopping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stopping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The `token` field of port.json, 32 random bytes in unpadded base64url.
  responses:
    Unauthorized:
      description: The request had no bearer token, or the wrong one.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer realm="pairtime"
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: >
        The request came from another computer, or its Host or Origin wasn't
        the agent's own.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [version, pid, started, uptime_s, mode, port, wakeups, jobs, ipc, adapters]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        pid:
          type: integer
          description: The agent's process id.
        started:
          type: string
          format: date-time
          description: When the agent started, in UTC.
        uptime_s:
          type: integer
          minimum: 0
          description: Whole seconds since `started`.
        mode:
          $ref: "#/components/schemas/Mode"
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port the agent listens on.
        wakeups:
          type: integer
          minimum: 0
          description: The scheduler's timer firings since the start.
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        ipc:
          $ref: "#/components/schemas/IPC"
        adapters:
          $ref: "#/components/schemas/Adapters"
        problems:
          type: object
          description: >
            What isn't working, keyed by where it comes from (`config`,
            `config-watch`, `state`, `port`, `ipc`), in words for the teen.
            Absent when nothing is wrong.
          additionalProperties:
            type: string
    Version:
      type: object
      additionalProperties: false
      required: [version, go_version, platform]
      properties:
        version:
          type: string
          description: The release, such as `v0.1.0`, or `dev`.
          examples: [v0.1.0, dev]
        commit:
          type: string
          description: The full git commit the binary was built from.
        date:
          type: string
          description: The commit or build time, RFC 3339 in UTC.
        modified:
          type: boolean
          description: The checkout had uncommitted changes.
        go_version:
          type: string
          examples: [go1.26.0]
        platform:
          type: string
          description: GOOS/GOARCH.
          examples: [windows/amd64, darwin/arm64, linux/amd64]
    Mode:
      type: string
      description: >
        Whether anything leaves the device (DESIGN 4.2). `local` uploads
        nothing, and it is the only mode until signing in exists (WP-SV3).
      enum: [local]
    Job:
      type: object
      additionalProperties: false
      required: [name, runs]
      properties:
        name:
          type: string
        every_s:
          type: number
          minimum: 0
          description: The job's period in seconds. Absent for a job that runs once.
        runs:
          type: integer
          minimum: 0
    IPC:
      type: object
      additionalProperties: false
      required: [stored, duplicates, refused]
      description: >
        The per-user socket hooks hand their messages to the agent on
        (DESIGN 3.3).
      properties:
        via:
          type: string
          enum: [socket, pipe]
          description: >
            `socket` for the AF_UNIX socket, or `pipe` for the named pipe
            Windows falls back to. Absent when hooks can't reach the agent and
            spool their messages instead.
        stored:
          type: integer
          minimum: 0
          description: >
            The messages the agent stored since it started, from the socket
            and the spool both.
        duplicates:
          type: integer
          minimum: 0
          description: Second copies of stored messages, which the agent dropped.
        refused:
          type: integer
          minimum: 0
          description: Connections turned away because they didn't come from this user.
    Adapters:
      type: object
      additionalProperties: false
      required: [harnesses, other, waiting, git]
      description: >
        What the harness adapters made of the hook calls the agent stored
        since it started, and what the git adapter watches (DESIGN 3.4, 5.3,
        5.8). The dashboard's list of adapters shows each one's last record
        and parse failures, so a broken parser shows instead of crediting
        less without a word.
      properties:
        harnesses:
          type: object
          description: The counts of each harness pairtime has an adapter for, by its name.
          additionalProperties:
            $ref: "#/components/schemas/HarnessCounts"
        other:
          $ref: "#/components/schemas/HarnessCounts"
        waiting:
          type: integer
          minimum: 0
          description: >
            Calls that wait for the device key and the ledger to open before
            they are parsed, in memory and in held.jsonl.
        dropped:
          type: integer
          minimum: 0
          description: Calls lost because held.jsonl was full. Absent when none.
        git:
          $ref: "#/components/schemas/Git"
    HarnessCounts:
      type: object
      additionalProperties: false
      required: [calls, records, parse_failures]
      properties:
        calls:
          type: integer
          minimum: 0
        records:
          type: integer
          minimum: 0
          description: The ledger records the calls made.
        parse_failures:
          type: integer
          minimum: 0
          description: >
            Calls the adapter couldn't fully read: unknown events or fields, a
            payload that isn't JSON, a call cut short. Their other records are
            still written.
        write_failures:
          type: integer
          minimum: 0
          description: Records the ledger refused. Absent when none.
        ignored:
          type: integer
          minimum: 0
          description: Calls from a folder a .pairtime-ignore keeps out, which make no record. Absent when none.
        last_record:
          type: integer
          description: The time of the newest record, in Unix milliseconds. Absent before the first.
        last_failure:
          type: string
          description: What the last failure was, naming events and fields but never their values.
    Git:
      type: object
      additionalProperties: false
      required: [watched, changes]
      properties:
        watched:
          type: integer
          minimum: 0
          description: The worktrees whose reflog the git adapter reads.
        changes:
          type: integer
          minimum: 0
          description: The git.change records written since the agent started.
    Stopping:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: stopping
