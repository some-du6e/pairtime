# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The agent's local API: what the agent serves on 127.0.0.1 to the local
# dashboard and to local tools such as footprint.yml (DESIGN 3.9; CP 6.3).
# `pairtime doctor` gets GET /v1/status's JSON over the agent's per-user
# socket instead (ipc.AskStatus), with no bearer token.
# web/ generates its TypeScript types from this file (SP 7.3), so a route or
# field changes here and in internal/agent in the same PR.
openapi: 3.1.0
info:
  title: pairtime agent, local API
  version: 0.3.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: |
    The agent listens on 127.0.0.1 only, on the port in port.json (7247 when
    it is free). Every request, the dashboard's files included, must come from
    a loopback address, carry a Host of `127.0.0.1:<port>` or
    `localhost:<port>`, and, when it has an Origin, have the dashboard's own
    (`http://127.0.0.1:<port>` or `http://localhost:<port>`). Anything else
    gets 403, which stops DNS rebinding and cross-site requests.

    The dashboard's static files at `/` need nothing more. Routes under
    `/v1/` also need one of two credentials. Local tools send the bearer
    token from port.json, which only the user who runs the agent can read.
    The dashboard sends the `pairtime_session` cookie instead. The cookie
    opens the routes the dashboard reads, and the one change it makes,
    PUT /v1/projects/{key}/name, which turns a project's name on or off on
    the owner's own pairtime dashboard and, signed in by the cookie, must
    carry the dashboard's Origin too. POST /v1/agent/stop takes the bearer
    token alone.

    `pairtime dashboard` signs the teen's browser in (DESIGN 3.9;
    D-dashboard-link). It asks the running agent for a one-time URL over the
    per-user socket, the way `pairtime recap` asks for the last work
    session, so it sends no token over TCP. It hands the URL to the browser
    in a file that only the user can read, so the code is on no process's
    command line. The file is in the data directory, or, where the default
    browser is a snap, which can't read the data directory, in that snap's
    `~/snap/<name>/common`. GET /signin trades the code for
    the cookie, `SameSite=Strict` and `HttpOnly`, and sends the browser on
    to the dashboard.
servers:
  - url: http://127.0.0.1:7247
    description: the default port; port.json has the real one
security:
  - bearer: []
  - session: []
paths:
  /v1/status:
    get:
      operationId: getStatus
      summary: What the running agent is doing
      description: >
        Read by footprint.yml and the dashboard. `pairtime doctor` gets the
        same JSON over the agent's socket (ipc.AskStatus), which needs no
        bearer token, so it sends the token over no TCP connection (#120).
        The answer is never cached.
      responses:
        "200":
          description: The agent's build, uptime, mode and scheduler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/agent/stop:
    post:
      operationId: stopAgent
      summary: Stop the agent
      description: >
        Answers first, then stops the agent the same way on every OS.
        Windows has no signal for a process without a console, and
        footprint.yml uses this to stop the agent cleanly. Only the bearer
        token can stop the agent; the dashboard's cookie can't.
      security:
        - bearer: []
      responses:
        "202":
          description: The agent is stopping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stopping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/days/{date}:
    get:
      operationId: getDay
      summary: One local day of this device, by project
      description: >
        One local day of this device, with a tally for each project that has
        anything in it (SM 5.3). The agent answers from the day's rollup in
        `days/`, which its scorer rewrites each time one of the day's minute
        buckets changes (DESIGN 3.5, 3.7; WP-AG4), and sums the day from its
        bucket store when there is none. `pairtime today` and `statusline`
        read the same rollups (WP-CO0). The dashboard asks for today about
        once a minute while it is open, so pending minutes turn final on the
        page, and for each earlier day of the span it shows. While `shadow`
        is true the answer leaves out everything the hidden credited time
        could be worked out from (Shadow). The answer is never cached.
      parameters:
        - name: date
          in: path
          required: true
          description: A day as YYYY-MM-DD, or `today` for today in the device's time zone.
          schema:
            type: string
          examples:
            today:
              value: today
            date:
              value: "2026-11-24"
      responses:
        "200":
          description: The day's tallies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Day"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/StoreError"
  /v1/sessions/last:
    get:
      operationId: getLastSession
      summary: The last work session, or the one still going
      description: >
        The most recent work session (SM 5.3: a run of one project's
        credited minutes, split where one ends more than `SESSION_GAP_S`,
        1,200 s, before the next starts), or the one still going, with the
        same tally as a day. The agent gives the same JSON to the CLI's
        `sessions/last` question over its socket, which `pairtime recap`
        asks (WP-CO0), and the dashboard's Today page shows it. `session` is
        null before the first. While `shadow` is true a session is its
        project and local date alone, with the tally Shadow allows. The
        answer is never cached.
      responses:
        "200":
          description: The session, or null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LastSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/StoreError"
  /v1/projects:
    get:
      operationId: getProjects
      summary: Every project this computer knows, and whether its name shows on its owner's dashboard
      description: >
        What `pairtime projects` lists, for the dashboard's Projects page:
        the projects of the git adapter's project map, of the last 30 days'
        rollups, of config.toml's `[projects.<key>]` tables and of the names
        the server shows (D-owner-names; docs/spec/project-names-v1.md),
        each with the name pairtime shows for it on this computer, the code
        the owner's pairtime dashboard calls it by, as the server gave it,
        and whether its name shows there. Like everything this API serves,
        it stays on this computer: only the uploader sends a name, once
        config.toml turns it on. The answer is never cached.
      responses:
        "200":
          description: The projects, in the order `pairtime projects` lists them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Projects"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{key}/name:
    put:
      operationId: putProjectName
      summary: Show a project's name on its owner's dashboard, or stop
      description: >
        Turns the project's name on or off on the owner's own pairtime
        dashboard, in config.toml's `[projects.<key>]` table, as `pairtime
        projects show-name` and `hide-name` do. Turning it on shows `label`,
        cleaned as the server cleans a sign-in's display name
        (projectname.CleanLabel), or without one the label the project
        showed before or its local name; the page shows the owner the label
        before they turn it on. Turning it off keeps the label in the file.
        The running agent's uploader then sends the change, and the answer
        is the project as GET /v1/projects lists it now.
      parameters:
        - name: key
          in: path
          required: true
          description: The project's key, as GET /v1/projects gives it.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameChoice"
      responses:
        "200":
          description: The project, with its name's new state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No project on this computer has that key.
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: >
            pairtime couldn't change config.toml, as when it doesn't parse or
            holds the project as an inline table, or the name is one pairtime
            keeps off the dashboard, hidden there, gone from the server or on
            for another sign-in, that it couldn't turn off in config.toml,
            which still has it on.
            The text says what to write by hand, and the file stays as it was.
          content:
            text/plain:
              schema:
                type: string
        "422":
          description: >
            Turning the name on needs a label the project hasn't got, as a
            plain folder has no name on this computer, or the label is empty
            once cleaned.
          content:
            text/plain:
              schema:
                type: string
  /signin:
    get:
      operationId: signIn
      summary: Sign this browser in to the dashboard
      description: >
        The one-time URL `pairtime dashboard` gets from the agent over its
        socket. A good code sets the session cookie and sends the browser to
        the dashboard. A used, old or wrong one sends it to
        `/?signin=expired`, where the dashboard says to run `pairtime
        dashboard` again. Either way the answer is a 303 and never cached.
        Only a GET uses a code up, so a HEAD, such as a link preview's,
        can't.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: >
            The code in the URL `pairtime dashboard` opened: 32 random bytes
            in unpadded base64url. It works once, for two minutes.
          schema:
            type: string
      responses:
        "303":
          description: >
            To `/` with a `Set-Cookie` for the session, or to
            `/?signin=expired` without one.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: >
                `pairtime_session=<id>; Path=/; HttpOnly; SameSite=Strict`,
                only for a good code. The session lasts until the agent
                stops, or until 8 hours pass with no request that uses it.
                The cookie sets no Expires or Max-Age.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The `token` field of port.json, 32 random bytes in unpadded base64url.
    session:
      type: apiKey
      in: cookie
      name: pairtime_session
      description: >
        The dashboard's sign-in, which GET /signin sets: 32 random bytes in
        unpadded base64url. The agent keeps its sessions in memory only.
  responses:
    Unauthorized:
      description: The request had no bearer token or session cookie, or a wrong one.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer realm="pairtime"
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: >
        The request came from another computer, or its Host or Origin wasn't
        the agent's own, or the session cookie signed in a change without
        the dashboard's Origin.
      content:
        text/plain:
          schema:
            type: string
    BadRequest:
      description: A parameter isn't what the route takes; the text says which.
      content:
        text/plain:
          schema:
            type: string
    StoreError:
      description: >
        The agent couldn't read its stores. The text says so, and the
        agent's log says why.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [version, pid, started, uptime_s, mode, port, wakeups, jobs, ipc, signals, adapters, apps, footprint]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        pid:
          type: integer
          description: The agent's process id.
        started:
          type: string
          format: date-time
          description: When the agent started, in UTC.
        uptime_s:
          type: integer
          minimum: 0
          description: Whole seconds since `started`.
        mode:
          $ref: "#/components/schemas/Mode"
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: >
            The port the agent listens on, and 0 while its HTTP server isn't
            listening yet, as a status asked over the socket at start-up can
            find it.
        wakeups:
          type: integer
          minimum: 0
          description: The scheduler's timer firings since the start.
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        ipc:
          $ref: "#/components/schemas/IPC"
        signals:
          $ref: "#/components/schemas/Signals"
        adapters:
          $ref: "#/components/schemas/Adapters"
        apps:
          $ref: "#/components/schemas/Apps"
        ledger:
          $ref: "#/components/schemas/Ledger"
        footprint:
          $ref: "#/components/schemas/Footprint"
        problems:
          type: object
          description: >
            What isn't working, keyed by where it comes from (`account`,
            `adapters.dropped`, `adapters.held`, `adapters.keys`,
            `adapters.ledger`, `adapters.pending`, `adapters.recover`,
            `adapters.replay`, `apps`, `apps.ledger`, `config`,
            `config-watch`, `focus`, `git`, `git.commits`, `git.ledger`,
            `ipc`, `keystore`, `ledger`, `ledger.presence`, `notifications`,
            `port`, `presence`, `procs`, `scorer`, `state`, `uploader`), in
            words for the teen. A value
            can join several problems of one source with "; ", so it is
            shown whole. `pairtime doctor` prints each as a line of its own,
            but for `keystore`, whose warning its keystore line gives.
            Absent when nothing is wrong.
          additionalProperties:
            type: string
    Ledger:
      type: object
      additionalProperties: false
      required: [late_local]
      description: >
        What the ledger writer says of its chain. Absent while the ledger
        isn't open, as while the keystore is locked.
      properties:
        late_local:
          type: integer
          minimum: 0
          description: >
            Records the writer dropped over the chain's life: made while
            config.toml said local-only, they reached it only after it had
            sealed a batch online since, so they never upload (D-late-local).
            It counts the adapters', presence's and the git watcher's;
            HarnessCounts.late_local is each harness's part since the agent
            started. The count rides in the seal frames, so drops after a
            run's last batch are left out after a restart. Nothing keeps
            which records were dropped across a restart, so a log line read
            again, or a hook call parsed again, after one is dropped, and
            counted, again.
    Footprint:
      type: object
      additionalProperties: false
      required: [cpu_s]
      description: >
        What the agent costs the computer since it started, as the OS reports
        it for the agent's own process and, for CPU time, the processes it
        ran and waited for, such as T3 Code's reader's `sqlite3` runs: the R8
        numbers `pairtime doctor --report` shares (DESIGN 5.9, 9.7).
        footprint.yml measures the same working set from outside the
        process, on Windows.
      properties:
        rss_bytes:
          type: integer
          minimum: 0
          description: >
            The resident set now, the working set on Windows. Absent where the
            OS doesn't say, as on macOS.
        peak_rss_bytes:
          type: integer
          minimum: 0
          description: The most the resident set has been. Absent where the OS doesn't say.
        cpu_s:
          type: number
          minimum: 0
          description: >
            The CPU time the agent has used, user and system, in seconds,
            with that of the processes it started and waited for: on Linux
            and macOS those it waited for, on Windows those it started since
            it joined a job object of its own, as it does at its start.
            Where it couldn't join one, the agent's own time alone.
    Version:
      type: object
      additionalProperties: false
      required: [version, go_version, platform]
      properties:
        version:
          type: string
          description: The release, such as `v0.1.0`, or `dev`.
          examples: [v0.1.0, dev]
        commit:
          type: string
          description: The full git commit the binary was built from.
        date:
          type: string
          description: The commit or build time, RFC 3339 in UTC.
        modified:
          type: boolean
          description: The checkout had uncommitted changes.
        go_version:
          type: string
          examples: [go1.26.0]
        platform:
          type: string
          description: GOOS/GOARCH.
          examples: [windows/amd64, darwin/arm64, linux/amd64]
    Mode:
      type: string
      description: >
        Whether anything leaves the device (DESIGN 4.2). `local` uploads
        nothing. `online` uploads the tier-1 numbers of DESIGN 4.3 to the
        server `pairtime login` linked, and `pairtime logout` goes back to
        `local` (WP-SV3).
      enum: [local, online]
    Job:
      type: object
      additionalProperties: false
      required: [name, runs]
      properties:
        name:
          type: string
        every_s:
          type: number
          minimum: 0
          description: The job's period in seconds. Absent for a job that runs once.
        runs:
          type: integer
          minimum: 0
    IPC:
      type: object
      additionalProperties: false
      required: [stored, duplicates, refused, spooled]
      description: >
        The per-user socket hooks hand their messages to the agent on
        (DESIGN 3.3).
      properties:
        via:
          type: string
          enum: [socket, pipe]
          description: >
            `socket` for the AF_UNIX socket, or `pipe` for the named pipe
            Windows falls back to. Absent when hooks can't reach the agent and
            spool their messages instead.
        stored:
          type: integer
          minimum: 0
          description: >
            The messages the agent stored since it started, from the socket
            and the spool both.
        duplicates:
          type: integer
          minimum: 0
          description: Second copies of stored messages, which the agent dropped.
        refused:
          type: integer
          minimum: 0
          description: Connections turned away because they didn't come from this user.
        spooled:
          $ref: "#/components/schemas/Spooled"
    Spooled:
      type: object
      additionalProperties: false
      required: [since, calls, prompts]
      description: >
        The hook calls made since `since`, a week before the reply, that
        reached the agent only through the spool, as when it wasn't
        running or didn't take them in time, of those its journal keeps.
        Their events get `via = plugin`, so they earn side-door credit
        (DESIGN 5.2), and `pairtime doctor` says how many there were.
      properties:
        since:
          type: string
          format: date-time
          description: The start of the week counted, in UTC.
        calls:
          type: integer
          minimum: 0
        prompts:
          type: integer
          minimum: 0
          description: How many of the calls were prompts.
        unknown:
          type: integer
          minimum: 0
          description: >
            How many of the calls the journal can't tell prompts from
            other events for, because a version before WP-AG6 recorded
            them. Absent when none.
    Adapters:
      type: object
      additionalProperties: false
      required: [harnesses, other, waiting, git]
      description: >
        What the harness adapters made of the hook calls the agent stored
        since it started, and what the git adapter watches (DESIGN 3.4, 5.3,
        5.8). The dashboard's list of adapters shows each one's last record
        and parse failures, so a broken parser shows instead of crediting
        less without a word.
      properties:
        harnesses:
          type: object
          description: The counts of each harness pairtime has an adapter for, by its name.
          additionalProperties:
            $ref: "#/components/schemas/HarnessCounts"
        other:
          $ref: "#/components/schemas/HarnessCounts"
        waiting:
          type: integer
          minimum: 0
          description: >
            Calls that wait to be parsed: for the device key and the ledger to
            open, in memory and in held.jsonl, or for the git adapter to work
            out their folder's project.
        dropped:
          type: integer
          minimum: 0
          description: Calls lost because held.jsonl was full. Absent when none.
        git:
          $ref: "#/components/schemas/Git"
        lookback:
          $ref: "#/components/schemas/Lookback"
    HarnessCounts:
      type: object
      additionalProperties: false
      required: [calls, records, parse_failures]
      properties:
        calls:
          type: integer
          minimum: 0
        records:
          type: integer
          minimum: 0
          description: The ledger records the calls and log lines made.
        parse_failures:
          type: integer
          minimum: 0
          description: >
            Calls the adapter couldn't fully read: unknown events or fields, a
            payload that isn't JSON, a call cut short. Their other records are
            still written.
        write_failures:
          type: integer
          minimum: 0
          description: Records the ledger refused. Absent when none.
        late_local:
          type: integer
          minimum: 0
          description: >
            Records the ledger dropped because they were made while
            config.toml said local-only and reached it only after it had
            sealed a batch online since, so they never upload (D-late-local).
            A log line read again, or a hook call parsed again, in the same
            run counts once; nothing keeps which records were dropped across
            a restart, so one read or parsed again after a restart counts
            again. Absent when none.
        ignored:
          type: integer
          minimum: 0
          description: Calls and log lines from a folder a .pairtime-ignore keeps out, which make no record. Absent when none.
        last_record:
          type: integer
          description: The time of the newest record, in Unix milliseconds. Absent before the first.
        last_failure:
          type: string
          description: What the last failure was, naming events and fields but never their values.
        lines:
          type: integer
          minimum: 0
          description: >
            Lines of the harness's log files, such as Claude Code's
            transcripts, that the adapter read since the agent started.
            Absent when none.
        line_failures:
          type: integer
          minimum: 0
          description: >
            Log lines the adapter couldn't fully read: a line that isn't JSON,
            an entry of a type or with a value its harness's version doesn't
            write, a line too long to read. Their other records are still
            written. Absent when none.
        repeats:
          type: integer
          minimum: 0
          description: >
            Records of log lines a replay read again, as after a crash or a
            restart, or of hook calls parsed again, as after a crash during a
            held.jsonl replay, that the ledger already held, which the adapter
            left out so none counts twice (D-late-local). A record the ledger dropped
            as made in local-only mode is no repeat: its replay in the same
            run is skipped, and counted nowhere. Absent when none.
    Apps:
      type: object
      additionalProperties: false
      description: >
        The agent apps whose own stores the agent reads, which drive
        harnesses for clients on other devices (DESIGN 3.3, 5.1). `pairtime
        doctor` prints its T3 Code line from this (DESIGN 5.9).
      properties:
        t3_code:
          $ref: "#/components/schemas/T3Code"
    T3Code:
      type: object
      additionalProperties: false
      required: [reading, day, witnessed, with_server, paired, aged, ahead]
      description: >
        How the reader of T3 Code's message store is doing, as its last
        read left it, and what it read today. It names no path. Absent
        until the reader's first read, which comes once the ledger is open.
      properties:
        reading:
          type: boolean
          description: The last read worked.
        "off":
          type: string
          enum: [no_store, not_running, no_sqlite3, no_json, schema, failed]
          description: >
            Why the last read didn't work: no store where T3 Code keeps it,
            no store with the `-wal` and `-shm` files T3 Code holds open, no
            `sqlite3` on the agent's PATH, as when one an earlier read found
            is gone when a run starts it, a `sqlite3` without JSON functions,
            a schema the probe refused, or a read that failed. Absent while
            it reads.
        problem:
          type: string
          description: >
            More of a refused schema or a failed read, in words for doctor.
            Absent when there is nothing more to say.
        newer:
          type: boolean
          description: >
            T3 Code's schema is newer than the one the reader was tested
            against, and the reader reads it anyway. Absent when it isn't.
        running:
          type: boolean
          description: >
            T3 Code ran at the last read (DESIGN 3.3): the agent's process
            scan found T3 Code's server, and its store had the `-wal` and
            `-shm` files T3 Code holds open. The files alone, which a T3
            Code killed while it held them leaves behind, don't make it run.
            Absent when it didn't.
        no_sqlite3:
          type: boolean
          description: >
            The last read found no `sqlite3` on the agent's PATH, whether or
            not T3 Code ran, or found the one an earlier read had found gone
            when a run started it, as when it was uninstalled, so doctor can
            say how to install it. Absent when there is one.
        day:
          type: string
          format: date
          description: The day the counts are for, in the agent's time zone.
        witnessed:
          type: integer
          minimum: 0
          description: >
            The messages T3 Code says a person sent that the reader recorded
            as `relay.message` records, declared `none`, that day.
        with_server:
          type: integer
          minimum: 0
          description: >
            Those of `witnessed` the reader recorded while T3 Code ran
            (`running`), with a server the app table names. When none of
            the day's messages paired and none was recorded this way,
            `pairtime doctor` says pairtime doesn't recognize T3 Code's
            server, as with one run from its source under `node`, whose
            sessions the agent never asks about (DESIGN 3.3).
        paired:
          type: integer
          minimum: 0
          description: The reader's records that paired with a prompt that day.
        aged:
          type: integer
          minimum: 0
          description: >
            The messages the age test turned away that day: decided more
            than `RELAY_SEEN_LAG_S` after T3 Code stamped them, as one first
            read that late is.
        ahead:
          type: integer
          minimum: 0
          description: >
            The messages the reader turned away that day as stamped more than
            2 s after the read that decided them, which a clock T3 Code and
            the agent share doesn't give unless it was set back (SM 2.2).
        session_at:
          type: integer
          description: >
            When a session that an agent app's server started last reached
            the agent, in Unix milliseconds, kept across restarts. Absent
            when none has.
    Git:
      type: object
      additionalProperties: false
      required: [watched, changes]
      properties:
        watched:
          type: integer
          minimum: 0
          description: The worktrees sessions worked in since the agent started whose reflog the git adapter has read.
        changes:
          type: integer
          minimum: 0
          description: The git.change records written since the agent started.
    Lookback:
      type: object
      additionalProperties: false
      required: [files, files_done, bytes, bytes_done, running]
      description: >
        How far lookback has read what the harnesses logged before pairtime
        did: the last 30 days of each log file a root's first listing found,
        read at low priority by a process of its own (DESIGN 5.9 step 9).
        It counts what earlier runs of the agent read too. Absent when
        there was nothing to read.
      properties:
        files:
          type: integer
          minimum: 0
          description: >
            The files with lines from before pairtime. A file that goes away
            leaves this count and files_done alike.
        files_done:
          type: integer
          minimum: 0
          description: >
            The files lookback is done with: read, or left unread for good,
            as after its reader failed three times.
        bytes:
          type: integer
          minimum: 0
          description: The bytes of those lines, in all the files.
        bytes_done:
          type: integer
          minimum: 0
          description: >
            The bytes lookback is done with: all of the files it is done
            with, as files_done counts them, and what it has read of the
            others.
        running:
          type: boolean
          description: Whether lookback's reader runs now.
        failures:
          type: integer
          minimum: 0
          description: >
            The reader's processes that failed since the agent started.
            After the third, the rest of each file's lines from before
            pairtime stay unread. Absent when none failed.
        error:
          type: string
          description: Why the last one failed. Absent when none did.
    Signals:
      type: object
      additionalProperties: false
      required: [idle, focus, power, lock]
      description: >
        Where the running agent reads idle time, focus, suspend and resume,
        and the lock state, or why each is unknown (DESIGN 3.3). `pairtime
        doctor` prints its idle and focus lines from this, so they say what
        the agent reads, not what the terminal doctor runs in can reach
        (DESIGN 5.9). Each is its source on Windows (WP-OS1, WP-OS2), the
        macOS notification loop's on macOS, and the desktop's on Linux
        (WP-OS9).
      properties:
        idle:
          $ref: "#/components/schemas/Signal"
        focus:
          $ref: "#/components/schemas/Signal"
        power:
          $ref: "#/components/schemas/Signal"
        lock:
          $ref: "#/components/schemas/Signal"
        session:
          type: string
          enum: [x11, wayland, none]
          description: The kind of desktop session, on Linux only.
        loop:
          $ref: "#/components/schemas/Loop"
        gnome_extension:
          type: string
          enum: [needs_login, unticked]
          description: >
            On GNOME, why pairtime's Shell extension isn't reporting which
            window is in front: `needs_login` until the teen logs out and
            back in once after install, `unticked` when install left it out
            (D-focus-unknown). The dashboard's Today page says what to do.
            Absent elsewhere, and until the extension's WP reports it.
        focus_level_c:
          type: boolean
          description: >
            True while focus is unknown and the agent reads idle time, where
            the scorer credits this desktop's slots at level C (SM 2.5;
            D-focus-unknown, WP-SC8). While `focus.unknown` is set the
            dashboard's Today page says this desktop doesn't tell pairtime
            which window is in front, and only while this is true does it
            add where that time counts. Absent where focus is known, and
            where idle time is unknown too, since nothing typed there counts
            (D-doctor-no-desktop).
    Signal:
      type: object
      additionalProperties: false
      description: >
        Exactly one of `via` and `unknown` is set. A signal with a source
        can still fail now and then; `problems` says when it does.
      properties:
        via:
          type: string
          description: >
            The source, such as `GetLastInputInfo`, `MIT-SCREEN-SAVER` or
            `logind PrepareForSleep`, in words for doctor.
        unknown:
          type: string
          description: >
            Why the agent has no source, such as a Wayland desktop that tells
            other programs nothing about focus, in words for doctor.
    Loop:
      type: object
      additionalProperties: false
      required: [main_thread, dropped]
      description: >
        The macOS notification loop, which gives the agent sleep, wake,
        screen lock and app activation notifications, on macOS only and once
        it runs.
      properties:
        main_thread:
          type: boolean
          description: >
            The loop runs on the process's main thread, where macOS delivers
            screen lock and app switch notifications. When it doesn't,
            locks and app switches may not arrive.
        dropped:
          type: integer
          minimum: 0
          description: Events lost because the agent fell behind.
    Stopping:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: stopping
    Day:
      type: object
      additionalProperties: false
      required: [date, zone, start, end, shadow, projects]
      description: One local day, as GET /v1/days/{date} gives it.
      properties:
        date:
          type: string
          format: date
          description: The day, as YYYY-MM-DD. Asked for `today`, the agent says which day that is.
          examples: ["2026-11-24"]
        zone:
          type: string
          description: The name of the time zone the day is counted in, as the device's clock gives it.
          examples: [Local]
        start:
          type: string
          format: date-time
          description: The start of the day, in UTC.
        end:
          type: string
          format: date-time
          description: The end of the day, in UTC. A day is 23 or 25 hours long where the clocks change.
        shadow:
          $ref: "#/components/schemas/Shadow"
        projects:
          type: array
          description: A row for each project with credit, agent time or uncredited time in the day, in project key order.
          items:
            $ref: "#/components/schemas/DayProject"
    DayProject:
      type: object
      additionalProperties: false
      required: [project, name, agent_only_s, agent_only_by_harness, uncredited]
      description: >
        One project's tally over a day (SM 5.1, 5.3). Seconds may be halves.
        While `shadow` is true the credited fields are absent (Shadow).
      properties:
        project:
          type: string
          description: The project's opaque key (AGENTS.md).
        name:
          $ref: "#/components/schemas/ProjectName"
        credited_s:
          $ref: "#/components/schemas/CreditedS"
        pending_s:
          $ref: "#/components/schemas/PendingS"
        credited_by_kind:
          $ref: "#/components/schemas/ByKind"
        credited_by_evidence:
          $ref: "#/components/schemas/ByEvidence"
        credited_by_reason:
          $ref: "#/components/schemas/ByReason"
        agent_only_s:
          $ref: "#/components/schemas/AgentOnlyS"
        agent_only_by_harness:
          $ref: "#/components/schemas/AgentOnlyByHarness"
        uncredited:
          $ref: "#/components/schemas/Uncredited"
        on_hold_s:
          $ref: "#/components/schemas/OnHoldS"
    LastSession:
      type: object
      additionalProperties: false
      required: [shadow, session]
      properties:
        shadow:
          $ref: "#/components/schemas/Shadow"
        session:
          $ref: "#/components/schemas/WorkSession"
    WorkSession:
      type: [object, "null"]
      additionalProperties: false
      required: [project, name, date, agent_only_s, agent_only_by_harness, uncredited]
      description: >
        A work session (SM 5.3) with the same tally as a project's day, or
        null before the first one. While `shadow` is true it has no `start`,
        `end` or `open`: with how long the session ran, the rest of its
        tally would give its credited time away (D-shadow-scope). `date`
        says which day it was then.
      properties:
        project:
          type: string
          description: The project's opaque key (AGENTS.md).
        name:
          $ref: "#/components/schemas/ProjectName"
        date:
          type: string
          format: date
          description: >
            The local day the session started on, as YYYY-MM-DD, in the zone
            the agent counts days in: the day its first credited minute
            starts in. It is there whether or not `shadow` is true, and while
            it is, it is all the session says of when it was.
          examples: ["2026-11-24"]
        start:
          type: string
          format: date-time
          description: The start of the session's first credited minute, in UTC. Absent while `shadow` is true.
        end:
          type: string
          format: date-time
          description: The end of its last credited minute so far, in UTC. Absent while `shadow` is true.
        open:
          type: boolean
          description: >
            True while the session goes on: SESSION_GAP_S hasn't passed
            since `end`, and no lock or suspend came after its credit
            stopped (DESIGN 3.8). Absent while `shadow` is true, since it
            says whether the last minute counted.
        credited_s:
          $ref: "#/components/schemas/CreditedS"
        pending_s:
          $ref: "#/components/schemas/PendingS"
        credited_by_kind:
          $ref: "#/components/schemas/ByKind"
        credited_by_evidence:
          $ref: "#/components/schemas/ByEvidence"
        credited_by_reason:
          $ref: "#/components/schemas/ByReason"
        agent_only_s:
          $ref: "#/components/schemas/AgentOnlyS"
        agent_only_by_harness:
          $ref: "#/components/schemas/AgentOnlyByHarness"
        uncredited:
          $ref: "#/components/schemas/Uncredited"
        on_hold_s:
          $ref: "#/components/schemas/OnHoldS"
    Shadow:
      type: boolean
      description: >
        `display.shadow` in config.toml (DESIGN 6.7 step 2; SM 7.5). While
        it is true, every view shows your time as "calibrating", and the
        answer leaves out everything the hidden credited time could be
        worked out from (D-shadow-scope): the credited and pending seconds,
        the credited-by-kind, by-evidence and by-reason maps, `on_hold_s`,
        every uncredited code but SM 4.2's loops (`X.reroll`,
        `X.rewrite_loop`, `X.same_error`, `X.autopilot`), `X.day_cap`
        included, and a session's `start`, `end` and `open`. The agent's
        time (`agent_only_s`, `agent_only_by_harness`) stays, and so do the
        loops with their seconds. A client reads a number that is left out
        as 0 and a map as empty. The files in `days/` and `buckets/` keep
        every number.
    Projects:
      type: object
      additionalProperties: false
      required: [date, linked, online, projects]
      description: GET /v1/projects.
      properties:
        date:
          type: string
          format: date
          description: Today, YYYY-MM-DD, the last of the 30 days whose projects are listed.
        linked:
          type: boolean
          description: "`pairtime login` linked this computer to a server."
        online:
          type: boolean
          description: >
            The names config.toml turns on go to the server: the computer is
            linked, and config.toml says `mode = "online"`. While it is false
            a name turned on waits on this computer.
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectEntry"
    ProjectEntry:
      type: object
      additionalProperties: false
      required: [project, code, local_name, state, label, sent]
      description: >
        One project, as `pairtime projects` lists it, and whether its name
        shows on its owner's own pairtime dashboard.
      properties:
        project:
          type: string
          description: The project's opaque key (AGENTS.md).
        code:
          type: string
          description: >
            Its short code, as the server's last answer about this
            computer's project names gave it (docs/spec/project-names-v1.md
            1.6): the owner's dashboard calls it "Project <code>" while its
            name is off. The server works codes out over every key the
            owner's computers uploaded, so this computer never works one out
            itself. Empty while the server has given none, as before the
            project's first minutes reach it, or before the agent reads the
            codes again, at its start and once a day; then `pairtime
            projects` and the page call the project by its key, which
            `pairtime projects show-name` takes too.
        local_name:
          type: string
          description: >
            The name pairtime shows for the project on this computer: the
            folder of its repo's main checkout, never a worktree's, or a bare
            repo's folder without `.git`. For a repo whose git directory
            lives apart from its checkout (`git init --separate-git-dir`),
            it is that directory's folder, since git doesn't record the
            checkout there. Empty when it has none, as a plain folder has
            none.
        state:
          type: string
          enum: ["off", "on", sending, removing, hidden]
          description: >
            Whether its name shows on the dashboard. `off` doesn't; `on`
            shows `label`, as the server's last answer said; `sending` is on
            in config.toml and goes with the uploader's next request, once
            the computer is online; `removing` is off in config.toml and
            still shown until that request; `hidden` is one the dashboard
            doesn't show, because the owner hid it there, the server no
            longer has it, or this computer signed in elsewhere (`why`),
            which pairtime then turned off here, or, when it couldn't change
            config.toml, no longer sends, so it stays off until they turn it
            on again on this computer.
        label:
          type: string
          description: >
            The label the name shows, or goes with, while it is on or being
            sent, and the label turning it on would show otherwise: the one
            config.toml kept, or the local name. Empty when there is none, so
            turning the name on needs one.
        sent:
          type: boolean
          description: >
            Whether a set of the name may have reached the server since its
            last answer about this computer's names: pairtime sent one and no
            answer came for it (docs/spec/project-names-v1.md 2). While the
            name is `sending`, the dashboard may show it already, as `pairtime
            projects` says.
        hidden_at:
          type: string
          format: date-time
          description: When pairtime found the name hidden on the dashboard, in UTC, for `hidden`.
        why:
          type: string
          enum: [dropped, signed_in, unreadable]
          description: >
            For `hidden`, why the dashboard doesn't show the name when the
            owner didn't hide it there: `dropped`, the server no longer has
            it, as after this computer was signed out a long time or the
            server's data was restored, which pairtime can't tell apart;
            `signed_in`, this computer signed in to another server, or as
            another device, which never showed it; `unreadable`, pairtime
            couldn't read which sign-in its project names were for, so it
            turned off the ones that were on. Absent for a name the owner
            hid on the dashboard.
    NameChoice:
      type: object
      additionalProperties: false
      required: [online]
      description: PUT /v1/projects/{key}/name's body.
      properties:
        online:
          type: boolean
          description: Show the project's name on the owner's dashboard, or stop.
        label:
          type: string
          description: >
            The label to show, which the agent cleans as the server cleans a
            display name. Without one, turning the name on shows the label
            the project has (ProjectEntry's `label`).
    ProjectName:
      type: string
      description: >
        The project's display name from the local project map: its
        repository's folder name, or the name the teen gave it. Like everything
        this API serves, it stays on this computer. Empty when the map has
        none, and then the views show the key.
    CreditedS:
      type: number
      minimum: 0
      description: Credited seconds, your time, pending minutes included. Absent while `shadow` is true.
    PendingS:
      type: number
      minimum: 0
      description: >
        The part of `credited_s` in minutes that are still pending (DESIGN
        3.7), which late records may change. Absent while `shadow` is true.
    AgentOnlyS:
      type: number
      minimum: 0
      description: >
        SM 5.3's `agent_only_s` for the project, the agent's side of the
        chess clock (DESIGN 3.8): the seconds this project's agent turns ran
        that this project didn't credit, including seconds credited to
        another project (SM 6.3; testdata/timelines/6.3,
        `agent_only_s.<project>`). These aren't the `X.agent_only` seconds,
        which nothing credited: SM 6.3's afternoon has 93 minutes of agent
        time and 4 of `X.agent_only`, and in SM 6.4 all 23,180 seconds of
        it are `X.absent`.
    OnHoldS:
      type: number
      minimum: 0
      description: >
        The part of `uncredited`'s `X.noprog` in minutes still pending or
        provisional (SM 4.3, 5.1): half-weighted seconds that progress
        within PROGRESS_RESTORE_S can still bring back. The views call only
        these "on hold" (approach-teen.md D5). Absent means 0, and it is
        absent while `shadow` is true.
    ByKind:
      type: object
      additionalProperties: false
      description: >
        `credited_s` by activity kind (SM 5.1), pending minutes included. A
        kind with no seconds may be left out. Absent while `shadow` is true.
      properties:
        prompting:
          type: number
          minimum: 0
        reading_output:
          type: number
          minimum: 0
        supervising:
          type: number
          minimum: 0
        reviewing:
          type: number
          minimum: 0
        testing:
          type: number
          minimum: 0
        debugging:
          type: number
          minimum: 0
        hand_edit:
          type: number
          minimum: 0
        lookup:
          type: number
          minimum: 0
    ByEvidence:
      type: object
      additionalProperties: false
      description: >
        `credited_s` by evidence level (SM 5.1, DESIGN 6.4), pending minutes
        included at the level they have so far. A level with no seconds may
        be left out. Absent while `shadow` is true.
      properties:
        A:
          type: number
          minimum: 0
        B:
          type: number
          minimum: 0
        C:
          type: number
          minimum: 0
    ByReason:
      type: object
      description: >
        `credited_s` by SM 5.2's credit code, with its `~r` and `+restored`
        suffixes, such as `READ~r` (SM 5.3), only the codes with credit.
        Absent while `shadow` is true.
      additionalProperties:
        type: number
        minimum: 0
    AgentOnlyByHarness:
      type: object
      additionalProperties: false
      description: >
        `agent_only_s` by the harness whose turn ran (SM 1.1). It lists every
        harness that had a session in the project in the span, with 0 for one
        that had no time on its own, so the views can name the agent whose
        answers were read: "reading Claude's answers".
      properties:
        claude_code:
          type: number
          minimum: 0
        cursor:
          type: number
          minimum: 0
        copilot:
          type: number
          minimum: 0
        codex:
          type: number
          minimum: 0
        gemini:
          type: number
          minimum: 0
        devin:
          type: number
          minimum: 0
        cline:
          type: number
          minimum: 0
        opencode:
          type: number
          minimum: 0
        other:
          type: number
          minimum: 0
    Uncredited:
      type: object
      additionalProperties: false
      description: >
        The project's seconds pairtime looked at and didn't credit, by
        reason code (SM 5.2). Agent-only seconds that no project credited
        are in it under the code each got, such as `X.agent_only`,
        `X.automated` or `X.absent`. Those another project credited aren't
        (SM 6.3), so `agent_only_s` can be more than `X.agent_only` and
        `X.automated` together. Credit past the day's cap is under
        `X.day_cap`. A reason with no seconds may be left out. While
        `shadow` is true only SM 4.2's loops are in it (Shadow).
      properties:
        X.absent:
          type: number
          minimum: 0
        X.other_focus:
          type: number
          minimum: 0
        X.ambiguous:
          type: number
          minimum: 0
        X.no_anchor:
          type: number
          minimum: 0
        X.agent_only:
          type: number
          minimum: 0
        X.automated:
          type: number
          minimum: 0
        X.no_input:
          type: number
          minimum: 0
        X.reroll:
          type: number
          minimum: 0
        X.rewrite_loop:
          type: number
          minimum: 0
        X.same_error:
          type: number
          minimum: 0
        X.autopilot:
          type: number
          minimum: 0
        X.noprog:
          type: number
          minimum: 0
        X.lookup_cap:
          type: number
          minimum: 0
        X.bucket_cap:
          type: number
          minimum: 0
        X.day_cap:
          type: number
          minimum: 0
