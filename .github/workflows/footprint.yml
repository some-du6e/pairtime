# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The client's footprint on windows-latest, measured by the OS around the
# process rather than by the agent (DESIGN 9.7; docs/PLAN.md, WP-AG1). An
# idle agent's working set must stay under 25 MB and its CPU time under
# 0.1% of the wall time. Private bytes, threads, handles and wakeups are
# reported with no gate yet, and ci.yml gates the binary size. After the
# idle span, this workflow times 200 warm `pairtime hook` calls from
# process start to exit, and 200 calls of an empty Go program built the
# same way, which is what any process costs on this runner. The hook's own
# cost, its p95 less the empty program's, must be at most 10 ms, and its
# p95 at most R8's 50 ms (DESIGN 9.7; docs/PLAN.md, WP-AG3;
# docs/errata/2026-11-20-hook-p95-gate.md). A PR that touches the client
# gets a 3-minute idle span; the nightly run, release tags and runs by hand
# get 10 minutes:
#
#   gh workflow run footprint.yml --ref <branch> [-f minutes=N]
name: footprint

on:
  pull_request:
    # docs/PLAN.md's paths for this workflow, plus go.sum and this file.
    paths:
      - internal/agent/**
      - internal/platform/windows/**
      - cmd/pairtime/**
      - go.mod
      - go.sum
      - .github/workflows/footprint.yml
  push:
    tags: ["v*"]
  schedule:
    # Half an hour after nightly.yml, so the two don't queue together.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes the agent sits idle while it is measured (up to 20)
        default: "10"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  footprint:
    name: idle agent on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # pairtime never uses cgo (AGENTS.md).
      CGO_ENABLED: "0"
      IDLE_MINUTES: ${{ github.event_name == 'pull_request' && '3' || inputs.minutes || '10' }}
    defaults:
      run:
        shell: pwsh
    steps:
      # Actions are pinned to commit SHAs; tags can be moved. Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Build pairtime.exe the way releases build it
        run: |
          go build -trimpath '-ldflags=-s -w' -o "$env:RUNNER_TEMP\pairtime.exe" ./cmd/pairtime
          "pairtime.exe is $((Get-Item "$env:RUNNER_TEMP\pairtime.exe").Length) bytes"
          # An empty Go program, built the same way, whose timing the hook's
          # own cost is measured over.
          $emptyDir = Join-Path $env:RUNNER_TEMP 'empty'
          New-Item -ItemType Directory -Force -Path $emptyDir | Out-Null
          Set-Content -Path (Join-Path $emptyDir 'go.mod') -Value "module empty`n`ngo 1.26`n"
          Set-Content -Path (Join-Path $emptyDir 'main.go') -Value "package main`n`nfunc main() {}`n"
          Push-Location $emptyDir
          go build -trimpath '-ldflags=-s -w' -o empty.exe .
          Pop-Location

      - name: Measure an idle agent
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'pairtime.exe'
          $emptyExe = Join-Path $env:RUNNER_TEMP 'empty\empty.exe'
          $ptHome = Join-Path $env:RUNNER_TEMP 'pairtime-home'
          New-Item -ItemType Directory -Force -Path $ptHome | Out-Null
          # Every pairtime file goes in this directory (internal/agent/home).
          $env:PAIRTIME_HOME = $ptHome
          $outLog = Join-Path $env:RUNNER_TEMP 'agent.out.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'agent.err.log'

          function Show-AgentLog {
            Write-Host '--- the agent log ---'
            Get-Content $errLog -ErrorAction SilentlyContinue | Write-Host
            Get-Content $outLog -ErrorAction SilentlyContinue | Write-Host
          }

          # The OS's view of the agent. Write-Host, not Write-Output, so the
          # warning doesn't become part of the returned sample.
          function Get-Sample($id) {
            $p = Get-Process -Id $id
            $switches = $null
            try {
              $threads = @(Get-CimInstance -ClassName Win32_PerfRawData_PerfProc_Thread -Filter "IDProcess = $id")
              if ($threads.Count -gt 0) {
                $switches = ($threads | Measure-Object -Property ContextSwitchesPersec -Sum).Sum
              }
            } catch {
              Write-Host "::warning::couldn't read the agent's thread context switches: $_"
            }
            [pscustomobject]@{
              Time       = [DateTime]::UtcNow
              Cpu        = $p.TotalProcessorTime.TotalSeconds
              WorkingSet = $p.WorkingSet64
              Private    = $p.PrivateMemorySize64
              Peak       = $p.PeakWorkingSet64
              Threads    = $p.Threads.Count
              Handles    = $p.HandleCount
              Switches   = $switches
            }
          }

          function Verdict($ok) { if ($ok) { 'pass' } else { '**FAIL**' } }

          $agent = Start-Process -FilePath $exe -ArgumentList 'agent' -PassThru -NoNewWindow `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          # Holding the handle keeps ExitCode readable after the agent exits.
          $null = $agent.Handle
          try {
            # The agent writes port.json once its HTTP server listens.
            $portFile = Join-Path $ptHome 'port.json'
            $deadline = (Get-Date).AddSeconds(60)
            while (-not (Test-Path $portFile)) {
              if ($agent.HasExited) { throw "the agent exited with status $($agent.ExitCode) before it was ready" }
              if ((Get-Date) -gt $deadline) { throw 'the agent wrote no port.json within 60 s' }
              Start-Sleep -Milliseconds 200
            }
            $pf = Get-Content $portFile -Raw | ConvertFrom-Json
            $headers = @{ Authorization = "Bearer $($pf.token)" }
            $base = "http://127.0.0.1:$($pf.port)"
            $status = Invoke-RestMethod -Uri "$base/v1/status" -Headers $headers
            Write-Host "agent $($status.version.version) is up on port $($pf.port) with pid $($agent.Id)"

            # Let start-up settle, then measure the idle span alone. Nothing
            # talks to the agent during it.
            Start-Sleep -Seconds 15
            $before = Get-Sample $agent.Id

            # The RSS budget holds over the whole span (DESIGN 9.7), and Go
            # hands freed memory back to Windows, so a rise in the middle
            # can be gone by the end. So the working set is read every 2 s,
            # which reads the OS's counters and wakes nothing in the agent.
            $end = $before.Time.AddMinutes([int]$env:IDLE_MINUTES)
            $highest = $before.WorkingSet
            $readings = 1
            while ($true) {
              $left = ($end - [DateTime]::UtcNow).TotalMilliseconds
              if ($left -le 0) { break }
              Start-Sleep -Milliseconds ([math]::Min(2000, [math]::Ceiling($left)))
              $ws = (Get-Process -Id $agent.Id).WorkingSet64
              $readings++
              if ($ws -gt $highest) { $highest = $ws }
            }
            $after = Get-Sample $agent.Id
            $readings++
            if ($after.WorkingSet -gt $highest) { $highest = $after.WorkingSet }
            # The peak counter only rises. If it rose during the span, the
            # working set reached the new peak then, so that is the span's
            # highest, even if it came and went between two readings.
            if ($after.Peak -gt $before.Peak -and $after.Peak -gt $highest) { $highest = $after.Peak }
            $status = Invoke-RestMethod -Uri "$base/v1/status" -Headers $headers

            # The hook's round trip, as a harness sees it: 200 warm calls of
            # pairtime hook in exec form with an event on stdin, each timed
            # from process start to exit, with the agent up. Ten calls first
            # warm the file cache and aren't counted. Each must exit 0 and
            # print nothing, which a harness reads as hook output (CP 6.2).
            #
            # Measure-Calls starts $path with $argList the way a harness runs
            # an exec-form hook, with stdin, stdout and stderr on pipes, writes
            # $stdin and closes it. For each counted call it keeps the time
            # from start to exit as this workflow sees it, and the process's
            # lifetime as Windows records it, from creation to exit, which
            # leaves out what starting a process costs the caller. With
            # $quiet, a call that exits non-zero or prints anything is bad.
            function Measure-Calls($path, $argList, $stdin, $warmup, $calls, $envVars = @{}, $quiet = $true) {
              $r = [pscustomobject]@{
                Times  = [System.Collections.Generic.List[double]]::new()
                Lives  = [System.Collections.Generic.List[double]]::new()
                Bad    = 0
                Stderr = ''
              }
              for ($i = 0; $i -lt $warmup + $calls; $i++) {
                $psi = [System.Diagnostics.ProcessStartInfo]::new($path)
                foreach ($a in $argList) { $psi.ArgumentList.Add($a) }
                foreach ($k in $envVars.Keys) { $psi.Environment[$k] = $envVars[$k] }
                $psi.UseShellExecute = $false
                $psi.CreateNoWindow = $true
                $psi.RedirectStandardInput = $true
                # UTF-8 with no byte-order mark, as a harness writes its event.
                $psi.StandardInputEncoding = [System.Text.UTF8Encoding]::new($false)
                $psi.RedirectStandardOutput = $true
                $psi.RedirectStandardError = $true
                $sw = [System.Diagnostics.Stopwatch]::StartNew()
                $p = [System.Diagnostics.Process]::Start($psi)
                # stderr is read while stdout is, or a child that fills the
                # stderr pipe first, as inittrace does, would never exit.
                $errRead = $p.StandardError.ReadToEndAsync()
                $p.StandardInput.Write($stdin)
                $p.StandardInput.Close()
                $out = $p.StandardOutput.ReadToEnd()
                $errText = $errRead.GetAwaiter().GetResult()
                $p.WaitForExit()
                $sw.Stop()
                if ($quiet -and ($p.ExitCode -ne 0 -or $out -ne '' -or $errText -ne '')) {
                  $r.Bad++
                  if ($r.Bad -le 3) { Write-Host "call $i of $path exited $($p.ExitCode), stdout '$out', stderr '$errText'" }
                }
                $r.Stderr = $errText
                if ($i -ge $warmup) {
                  $r.Times.Add($sw.Elapsed.TotalMilliseconds)
                  $r.Lives.Add(($p.ExitTime - $p.StartTime).TotalMilliseconds)
                }
                $p.Dispose()
              }
              $r
            }
            function Quantile($list, $q) {
              $sorted = @($list | Sort-Object)
              $sorted[[math]::Ceiling($q * $sorted.Count) - 1]
            }
            function Ms($v) { "$([math]::Round($v, 1)) ms" }

            $hookEvent = '{"session_id":"footprint","hook_event_name":"UserPromptSubmit","prompt":"time this hook"}'
            $hookArgs = @('hook', '--harness', 'claude_code', '--event', 'UserPromptSubmit')
            $warmup = 10
            $hookCalls = 200
            $hook = Measure-Calls $exe $hookArgs $hookEvent $warmup $hookCalls
            $hookP95 = Quantile $hook.Times 0.95
            $hookP50 = Quantile $hook.Times 0.50
            $hookMax = Quantile $hook.Times 1
            $hookBad = $hook.Bad

            # What a process costs on this runner, which differs from one
            # windows-latest machine to the next: an empty Go program, started
            # and timed the same way, as many times. The hook's gate is its
            # p95 over this one's. And what pairtime spends before main, by
            # GODEBUG=inittrace=1, with the slowest packages in the log.
            $empty = Measure-Calls $emptyExe @() '' $warmup $hookCalls
            $emptyP95 = Quantile $empty.Times 0.95
            $hookOver = $hookP95 - $emptyP95
            $trace = Measure-Calls $exe @('hook', '-h') '' 1 1 @{ GODEBUG = 'inittrace=1' } $false
            $inits = foreach ($l in ($trace.Stderr -split "`n")) {
              if ($l -match '^init (\S+) @[0-9.]+ ms, ([0-9.]+) ms clock') {
                [pscustomobject]@{ Pkg = $Matches[1]; Ms = [double]$Matches[2] }
              }
            }
            $initTotal = ($inits | Measure-Object -Property Ms -Sum).Sum
            $initTop = ($inits | Sort-Object Ms -Descending | Select-Object -First 3 | ForEach-Object { "$($_.Pkg) $($_.Ms) ms" }) -join ', '
            Write-Host "--- pairtime's slowest package inits (GODEBUG=inittrace=1), in all $initTotal ms ---"
            $inits | Sort-Object Ms -Descending | Select-Object -First 15 | ForEach-Object { Write-Host "$($_.Ms) ms  $($_.Pkg)" }

            $wall = ($after.Time - $before.Time).TotalSeconds
            $cpuShare = ($after.Cpu - $before.Cpu) / $wall
            $minutes = $wall / 60
            $switchesPerMinute = 'n/a'
            if ($null -ne $before.Switches -and $null -ne $after.Switches) {
              $switchesPerMinute = [math]::Round(($after.Switches - $before.Switches) / $minutes, 1)
            }
            # What the wakeups were. presence.sample runs only while a project
            # context is live, which a terminal in front makes (DESIGN 3.3),
            # and the runner's foreground window can be the step's console.
            $jobRuns = (@($status.jobs) | ForEach-Object { "$($_.name) $($_.runs)" }) -join ', '

            # A second agent on the same data directory exits at once with
            # status 3 (pairtime agent -h).
            $second = Start-Process -FilePath $exe -ArgumentList 'agent' -PassThru -NoNewWindow -Wait `
              -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'second.out.log') `
              -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'second.err.log')
            $secondStatus = $second.ExitCode

            # A clean stop: the agent exits 0 and leaves pid 0 in port.json.
            $null = Invoke-RestMethod -Method Post -Uri "$base/v1/agent/stop" -Headers $headers
            if (-not $agent.WaitForExit(20000)) { throw 'the agent was still running 20 s after POST /v1/agent/stop' }
            $stopStatus = $agent.ExitCode
            $pidAfter = (Get-Content $portFile -Raw | ConvertFrom-Json).pid

            # The calls the agent took over its socket: the journal's lines for
            # hook calls that came that way, read once the agent has stopped.
            # ipc.stored can't tell: a call the agent acks late is spooled,
            # and a drain during the run stores it too.
            $hookSocket = 0
            foreach ($f in @(Get-ChildItem -Path (Join-Path $ptHome 'received') -Filter '*.jsonl' -ErrorAction SilentlyContinue)) {
              foreach ($line in [System.IO.File]::ReadAllLines($f.FullName)) {
                if ($line.Trim() -eq '') { continue }
                try { $entry = $line | ConvertFrom-Json } catch { continue }
                if ($entry.kind -eq 'hook' -and $entry.via -eq 'socket') { $hookSocket++ }
              }
            }

            $budgetRss = 25000000
            $budgetCpu = 0.001
            # The hook's own cost over the runner's floor, and R8's claim for a
            # warm round trip, which no call may come near on a runner.
            $budgetHookOverMs = 10
            $budgetHookMs = 50
            $rssOk = $highest -lt $budgetRss
            $cpuOk = $cpuShare -lt $budgetCpu
            $secondOk = $secondStatus -eq 3
            $stopOk = ($stopStatus -eq 0) -and ($pidAfter -eq 0)
            $hookOverOk = $hookOver -le $budgetHookOverMs
            $hookCapOk = $hookP95 -le $budgetHookMs
            $hookQuietOk = $hookBad -eq 0
            $rows = @(
              "### Idle agent on windows-latest, $([math]::Round($minutes, 1)) minutes",
              '',
              '| measure | value | gate |',
              '|---|---:|---|',
              "| highest working set over the span ($readings readings and the peak counter) | $highest bytes | under $budgetRss bytes: $(Verdict $rssOk) |",
              "| CPU time over wall time | $([math]::Round($cpuShare, 6)) | under ${budgetCpu}: $(Verdict $cpuOk) |",
              "| working set at the start and end of the span | $($before.WorkingSet), $($after.WorkingSet) bytes | none |",
              "| peak working set since start-up | $($after.Peak) bytes | none |",
              "| private bytes | $($after.Private) bytes | none |",
              "| threads, handles | $($after.Threads), $($after.Handles) | none |",
              "| thread context switches per minute | $switchesPerMinute | none |",
              "| scheduler wakeups | $($status.wakeups) | none |",
              "| runs of each scheduler job | $jobRuns | none |",
              "| binary size | $((Get-Item $exe).Length) bytes | ci.yml |",
              "| a second agent's exit status | $secondStatus | 3: $(Verdict $secondOk) |",
              "| clean stop: exit status, pid in port.json | $stopStatus, $pidAfter | 0, 0: $(Verdict $stopOk) |",
              "| the hook's own cost: its p95 over $hookCalls warm calls less an empty Go program's p95, both timed around the process | $(Ms $hookOver) | at most $budgetHookOverMs ms: $(Verdict $hookOverOk) |",
              "| hook p95 over $hookCalls warm calls, timed around the process | $(Ms $hookP95) | at most $budgetHookMs ms (R8): $(Verdict $hookCapOk) |",
              "| an empty Go program over $hookCalls calls, timed the same way: p50, p95 | $(Ms (Quantile $empty.Times 0.5)), $(Ms $emptyP95) | none |",
              "| hook p50, slowest | $(Ms $hookP50), $(Ms $hookMax) | none |",
              "| hook lifetime from creation to exit, as Windows records it: p50, p95 | $(Ms (Quantile $hook.Lives 0.5)), $(Ms (Quantile $hook.Lives 0.95)) | none |",
              "| pairtime's package init (GODEBUG=inittrace=1): in all, slowest | $(Ms $initTotal); $initTop | none |",
              "| hook calls that exited non-zero or printed anything | $hookBad | 0: $(Verdict $hookQuietOk) |",
              "| hook calls the agent took over its socket, by its journal | $hookSocket of $($warmup + $hookCalls) | none: a call acked late is spooled, and a drain journals it as from the inbox |"
            )
            $summary = $rows -join "`n"
            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Host $summary
            if (-not ($rssOk -and $cpuOk -and $secondOk -and $stopOk -and $hookOverOk -and $hookCapOk -and $hookQuietOk)) {
              throw 'the agent failed a footprint gate; see the table above'
            }
          } catch {
            Show-AgentLog
            throw
          } finally {
            if (-not $agent.HasExited) { Stop-Process -Id $agent.Id -Force }
          }
