# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The race detector, once a day. -race needs cgo, so this is the one place
# pairtime builds with CGO_ENABLED=1, and it runs on Linux only (DESIGN 3.13;
# AGENTS.md). A WP marked "Race: yes" runs it on its branch before review:
#
#   gh workflow run nightly.yml --ref <branch>
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    # Only to try out changes to this workflow on their own PR.
    paths:
      - .github/workflows/nightly.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  race:
    name: go test -race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The one exception to CGO_ENABLED=0: the race detector needs cgo.
      CGO_ENABLED: "1"
      # DESIGN 3.13 races the long-running, concurrent code: the agent and
      # the server.
      RACE_DIRS: internal/agent internal/server
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to commit SHAs; tags can be moved. Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: go test -race
        run: bash tools/ci/test_existing.sh -race -count=1 -- $RACE_DIRS
