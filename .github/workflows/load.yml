# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The agent under a heavy Claude Code user's load, on ubuntu-latest (#393).
# internal/agent's TestSustainedLoad builds a synthetic ~/.claude/projects
# of about 1,800 folders and 3,400 transcripts, starts an agent on it, lets
# it idle a minute, and then for 90 s appends to 100 of the transcripts,
# makes new tool-result files, subagents and sessions, and sends hook calls
# at 1.3 a second, as #393 measured on a busy machine. It reports CPU a
# minute idle and active, CPU a hook call and bytes written an hour, and
# this workflow counts the opens, directory reads and stats of the active
# span's last 30 s with bpftrace, which the test leaves out of the span it
# measures the CPU over. Each run's CPU profile is an artifact, and its
# top functions are in the log. The data is synthetic, so neither holds
# any content.
#
# It runs by hand. With base, it runs the test on that ref's code too,
# with this ref's test copied in, and puts the two runs side by side. They
# do the same work, so its counts must agree. The agent's own counts of
# what it took can still differ by a record between two runs of the same
# code (#393), so they are compared as a warning until the replay is
# deterministic.
#
#   gh workflow run load.yml --ref <branch> [-f seconds=N] [-f base=<ref>]
name: load

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of the active span (at least 60)
        default: "90"
      base:
        description: A ref to run the same test on too, for a before and after (empty for none)
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # pairtime never uses cgo (AGENTS.md).
      CGO_ENABLED: "0"
      PAIRTIME_LOAD: "1"
      PAIRTIME_LOAD_SECONDS: ${{ inputs.seconds || '90' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: bpftrace, to count the system calls
        run: |
          if ! command -v bpftrace > /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq bpftrace || echo "::warning::bpftrace didn't install, so the run counts no system calls"
          fi

      - name: The load on the base's code, with this ref's test
        if: inputs.base != ''
        env:
          BASE: ${{ inputs.base }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          git worktree add "$RUNNER_TEMP/base" FETCH_HEAD
          cp internal/agent/load_linux_test.go "$RUNNER_TEMP/base/internal/agent/"
          bash tools/ci/load.sh before "$RUNNER_TEMP/base"

      - name: The load on this ref's code
        run: bash tools/ci/load.sh after "$GITHUB_WORKSPACE"

      - name: Where the CPU went, and the runs side by side
        if: always()
        run: |
          for r in before after; do
            [ -f "$RUNNER_TEMP/$r.cpu.out" ] || continue
            echo "== $r: top functions by cumulative CPU"
            go tool pprof -top -cum -nodecount=45 "$RUNNER_TEMP/$r.cpu.out" 2> /dev/null || true
            echo "== $r: system calls in the active span's last 30 s"
            cat "$RUNNER_TEMP/$r.syscalls.txt" 2> /dev/null || echo "none counted"
          done
          python3 - "$RUNNER_TEMP" <<'EOF'
          import json, os, sys
          tmp = sys.argv[1]
          runs = {}
          for r in ("before", "after"):
              p = os.path.join(tmp, r + ".json")
              if os.path.exists(p):
                  runs[r] = json.load(open(p))
          if not runs:
              sys.exit("no run wrote its report")
          keys = list(next(iter(runs.values())))
          print(f"{'':32}" + "".join(f"{r:>18}" for r in runs))
          for k in keys:
              print(f"{k:32}" + "".join(f"{runs[r].get(k, ''):>18.6g}" if isinstance(runs[r].get(k), (int, float)) else f"{str(runs[r].get(k, '')):>18}" for r in runs))
          if len(runs) == 2:
              work = ["files", "folders", "hooks", "hooks_via_socket", "lines_appended", "files_created"]
              took = ["claude_code_calls", "claude_code_records", "claude_code_parse_failures", "claude_code_ignored"]
              differ = [k for k in work if runs["before"].get(k) != runs["after"].get(k)]
              if differ:
                  print(f"::error::the runs before and after did different work: {', '.join(differ)}")
                  sys.exit(1)
              differ = [k for k in took if runs["before"].get(k) != runs["after"].get(k)]
              if differ:
                  print(f"::warning::the agent took different counts in the two runs, which runs of the same code can still do (#393): {', '.join(differ)}")
              else:
                  print("The runs before and after did the same work, and the agent took the same counts.")
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load
          path: |
            ${{ runner.temp }}/*.json
            ${{ runner.temp }}/*.cpu.out
            ${{ runner.temp }}/*.syscalls.txt
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
