# Throwaway probe for WP-HL1's PR A: each fix's cases pass on the clean
# tree and fail with that fix reverted (.github/probe-hl1-a.py). Never
# merged.
name: probe-hl1-a
on:
  push:
    branches: [probe-hl1-a]
  workflow_dispatch:
concurrency:
  group: probe-hl1-a-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mutant:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [score, agent]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum
      - name: revert each fix and run its cases
        run: python3 .github/probe-hl1-a.py ${{ matrix.group }}
