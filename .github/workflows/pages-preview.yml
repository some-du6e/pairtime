# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Writes pairtimed's public pages as the server sends them and uploads them
# as the `pages` artifact, so a reviewer can look at a change to the pages
# in a browser without building pairtimed (tools/pagespreview). It runs on
# PRs that touch the pages or what they draw, and by hand:
# gh workflow run pages-preview.yml --ref <branch>
name: pages-preview

on:
  pull_request:
    paths:
      - internal/server/pages/**
      - internal/server/dashboard/**
      - docs/retention.json
      - internal/server/retention/**
      - tools/pagespreview/**
      - pkg/projectname/**
      - .github/workflows/pages-preview.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: write the pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Write the pages
        run: go run ./tools/pagespreview -out "$RUNNER_TEMP/pages"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages
          path: ${{ runner.temp }}/pages
          retention-days: 7
