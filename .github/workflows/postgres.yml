# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The server tests against Postgres 18, the scale-out path (DESIGN 3.13,
# 10.6; SP 7.4, 9.5). pairtimed runs on SQLite, and ci.yml tests that on
# every PR. This workflow runs the same tests with a Postgres service as
# well, so SQL that only SQLite accepts fails here. It runs nightly and on
# PRs that touch the SQL: the store, the migrations, the writer, the
# accounts, sign-in, device and ingest packages, the rollups, the witness
# labels, the server key's history, the day roots, the privacy hub's
# eraser, the calibration flag, and the retention jobs, including
# docs/retention.json, whose bindings the jobs build their DELETEs from.
#
#   gh workflow run postgres.yml --ref <branch>
name: postgres

on:
  pull_request:
    paths:
      - internal/server/store/**
      - internal/server/migrations/**
      - internal/server/writer/**
      - internal/server/accounts/**
      - internal/server/auth/**
      - internal/server/device/**
      - internal/server/retention/**
      - internal/server/ingest/**
      - internal/server/rollup/**
      - internal/server/buildday/**
      - internal/server/devlog/**
      - internal/server/projectnames/**
      - internal/server/witness/**
      - internal/server/keys/**
      - internal/server/publisher/**
      - internal/server/privacy/**
      - internal/server/shadow/**
      - docs/retention.json
      - docs/embed.go
      - .github/workflows/postgres.yml
  schedule:
    # Half an hour after nightly.yml, so the two don't queue together.
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres:
    name: server tests on Postgres 18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # The major version is what is tested; the image's own minor
        # releases are bug and security fixes.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pairtime
          POSTGRES_PASSWORD: pairtime
          POSTGRES_DB: pairtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pairtime -d pairtime"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # pairtime never uses cgo (AGENTS.md).
      CGO_ENABLED: "0"
      # storetest runs every store-backed test on SQLite and, with this
      # set, on Postgres too, each test in a schema of its own.
      PAIRTIME_TEST_POSTGRES_URL: postgres://pairtime:pairtime@localhost:5432/pairtime?sslmode=disable
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to commit SHAs; tags can be moved. Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Postgres version
        run: docker exec "${{ job.services.postgres.id }}" psql -U pairtime -d pairtime -Atc 'SELECT version()'

      - name: go test (server packages, SQLite and Postgres)
        run: bash tools/ci/test_existing.sh -count=1 -- internal/server

      - name: The Postgres variants ran
        # Tests reach Postgres only through storetest.Engines() and the
        # variable above, so a green run proves nothing unless they did.
        # This reruns the migration and commit-rate tests verbosely and
        # fails unless each engine's variant passed. It also prints the
        # commit rates the acceptance test measured.
        run: |
          out=$(go test -count=1 -v -run '^(TestApply|TestCommitRate)$' ./internal/server/migrations ./internal/server/writer) || {
            echo "$out"
            exit 1
          }
          grep -E -e '--- (PASS|FAIL|SKIP): Test(Apply|CommitRate)/[a-z]+(/10,000[^ ]*)? ' -e 'transactions a second' <<<"$out"
          for t in TestApply/sqlite TestApply/postgres TestCommitRate/sqlite/10,000 TestCommitRate/postgres/10,000; do
            if ! grep -q -- "--- PASS: $t" <<<"$out"; then
              echo "::error::$t didn't run and pass"
              exit 1
            fi
          done

      - name: The retention jobs ran on Postgres
        # The fake-clock retention test deletes rows with the jobs' own SQL
        # (WP-SV14). Its parent line passes only when every case did.
        run: |
          out=$(go test -count=1 -v -run '^TestSweep$' ./internal/server/retention) || {
            echo "$out"
            exit 1
          }
          for t in TestSweep/sqlite TestSweep/postgres; do
            if ! grep -q -- "--- PASS: $t (" <<<"$out"; then
              echo "::error::$t didn't run and pass"
              exit 1
            fi
            grep -- "--- PASS: $t (" <<<"$out"
          done
