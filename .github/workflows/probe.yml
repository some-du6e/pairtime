# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Looks at a deployed server from GitHub's network, outside the host
# (docs/PLAN.md, WP-OP1 and WP-OP2): TLS that verifies and isn't about to
# expire, /healthz answering 200 ok, and /.well-known/pairtime-keys.json
# in its format, with one current server key and, once the server holds
# one, its evidence key (docs/spec/keys-v1.md). By hand only:
#
#   gh workflow run probe.yml -f host=pairtime.karimeltaib.com
#
# Every request sends a descriptive User-Agent. Cloudflare's Bot Fight
# Mode answers the default curl agent from a data-center address, which a
# runner is, with a 403 challenge, and that is the edge refusing the probe,
# not the server failing; the probe says which it was (deploy/runbook.md,
# User-Agent).
name: probe

on:
  workflow_dispatch:
    inputs:
      host:
        description: "The server's host name, without https://, such as pairtime.example.org"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.host }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: probe https://${{ inputs.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      HOST: ${{ inputs.host }}
      AGENT: pairtime-probe/${{ github.sha }} (+https://github.com/some-du6e/pairtime)
    steps:
      - name: The host name
        run: |
          if ! grep -qE '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$' <<<"$HOST"; then
            echo "::error::'$HOST' isn't a host name: give it without https:// or a path"
            exit 1
          fi

      - name: TLS verifies, and the certificate has 14 days left
        run: |
          # The chain and the name, as a browser checks them, then the dates.
          cert=$(openssl s_client -connect "$HOST:443" -servername "$HOST" -verify_hostname "$HOST" -verify_return_error < /dev/null 2> "$RUNNER_TEMP/tls.err") || {
            cat "$RUNNER_TEMP/tls.err"
            echo "::error::the TLS handshake with $HOST failed or its certificate doesn't verify"
            exit 1
          }
          openssl x509 -noout -subject -issuer -enddate <<<"$cert"
          if ! openssl x509 -noout -checkend $((14 * 86400)) <<<"$cert" > /dev/null; then
            echo "::error::$HOST's certificate expires within 14 days"
            exit 1
          fi

      - name: /healthz answers 200 ok
        run: |
          code=$(curl -sS -A "$AGENT" --max-time 20 -D "$RUNNER_TEMP/healthz.h" -o "$RUNNER_TEMP/healthz.b" -w '%{http_code}' "https://$HOST/healthz") || {
            echo "::error::https://$HOST/healthz didn't answer"
            exit 1
          }
          body=$(tr -d '\r\n' < "$RUNNER_TEMP/healthz.b")
          if [ "$code" = 403 ] && grep -qi '^cf-mitigated: challenge' "$RUNNER_TEMP/healthz.h"; then
            echo "::error::Cloudflare challenged the probe (403, cf-mitigated: challenge): the edge refused it, not pairtimed. Check the zone's bot settings for this User-Agent (deploy/runbook.md, User-Agent)"
            exit 1
          fi
          if [ "$code" != 200 ] || [ "$body" != ok ]; then
            echo "::error::https://$HOST/healthz answered $code '${body:0:200}', not 200 ok"
            exit 1
          fi
          echo "https://$HOST/healthz answered 200 ok"

      - name: /.well-known/pairtime-keys.json is a keys document with one current server key
        run: |
          code=$(curl -sS -A "$AGENT" --max-time 20 -D "$RUNNER_TEMP/keys.h" -o "$RUNNER_TEMP/keys.json" -w '%{http_code}' "https://$HOST/.well-known/pairtime-keys.json") || {
            echo "::error::https://$HOST/.well-known/pairtime-keys.json didn't answer"
            exit 1
          }
          if [ "$code" = 403 ] && grep -qi '^cf-mitigated: challenge' "$RUNNER_TEMP/keys.h"; then
            echo "::error::Cloudflare challenged the probe (deploy/runbook.md, User-Agent)"
            exit 1
          fi
          if [ "$code" = 404 ]; then
            echo "::error::https://$HOST/.well-known/pairtime-keys.json is 404: the deployed pairtimed predates WP-SV17, which serves it"
            exit 1
          fi
          if [ "$code" != 200 ] || ! jq -e 'type == "object"' "$RUNNER_TEMP/keys.json" > /dev/null; then
            echo "::error::https://$HOST/.well-known/pairtime-keys.json answered $code with something that isn't a JSON object"
            head -c 300 "$RUNNER_TEMP/keys.json"
            exit 1
          fi
          jq . "$RUNNER_TEMP/keys.json"
          doc="$RUNNER_TEMP/keys.json"
          # docs/spec/keys-v1.md 2: the format, then each key's members. A
          # key id is 16 lowercase hex digits, a server key 32 bytes in hex,
          # and the evidence key an uncompressed P-256 point in hex.
          if ! jq -e '.format == "pairtime-keys-v1"' "$doc" > /dev/null; then
            echo "::error::the keys document's format is $(jq -c .format "$doc"), not pairtime-keys-v1"
            exit 1
          fi
          shape='type == "object" and (.key_id | type == "string" and test("^[0-9a-f]{16}$")) and (.valid_from | type == "number") and (.valid_to == null or (.valid_to | type == "number"))'
          if ! jq -e "(.server_keys | type == \"array\") and all(.server_keys[]; $shape and (.public_key | type == \"string\" and test(\"^[0-9a-f]{64}$\")))" "$doc" > /dev/null; then
            echo "::error::the keys document's server_keys isn't a list of keys with a 16-digit key_id, a 64-digit public_key, a valid_from and a valid_to"
            exit 1
          fi
          current=$(jq '[.server_keys[] | select(.valid_to == null)] | length' "$doc")
          if [ "$current" != 1 ]; then
            echo "::error::the keys document lists $current current server keys, and a server has exactly one (docs/spec/keys-v1.md 3)"
            exit 1
          fi
          echo "the current server key is $(jq -r '.server_keys[] | select(.valid_to == null) | .key_id' "$doc")"
          if jq -e '.evidence_key == null' "$doc" > /dev/null; then
            echo "::notice::the keys document lists no evidence key: the server holds none yet, or its pairtimed predates WP-SB2"
          elif ! jq -e ".evidence_key | $shape and .valid_to == null and (.public_key | type == \"string\" and test(\"^04[0-9a-f]{128}$\"))" "$doc" > /dev/null; then
            echo "::error::the keys document's evidence_key isn't one current key with a 16-digit key_id and an uncompressed P-256 point as public_key (docs/spec/seal-v1.md 7)"
            exit 1
          else
            echo "the evidence key is $(jq -r .evidence_key.key_id "$doc")"
          fi
