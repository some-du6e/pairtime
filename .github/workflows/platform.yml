# SPDX-License-Identifier: AGPL-3.0-or-later
#
# OS-specific client tests. Windows and macOS runners are scarce and shared
# with another busy project, so they run only here, only when platform code
# changes, on release tags and by hand (DESIGN 3.13). Each job tests the
# platform packages, not the whole module: ci.yml already does that on Linux.
name: platform

on:
  pull_request:
    # DESIGN 3.13's paths, plus the files this workflow runs. Keep the code
    # paths in step with PLATFORM_DIRS below.
    paths:
      - internal/platform/**
      - internal/install/**
      - internal/agent/ipc/**
      # The agent's own files, startIPC in messages.go among them. ipc's
      # TestAgentKilledMidStream runs a real agent.Run, and this is where it
      # runs on Windows (socket and pipe) and macOS. It lives in
      # internal/agent/ipc, so PLATFORM_DIRS needn't list these.
      - internal/agent/*.go
      # The agent's platform code: the lock, the data directories and
      # private files (home), the loopback server (localhttp), the spool,
      # which Windows file sharing makes OS-specific (inbox), presence,
      # whose smoke test runs on the real Windows sources, and the device
      # keystore, which picks DPAPI, the Keychain or the Secret Service by
      # OS (keys).
      - internal/agent/inbox/**
      - internal/agent/home/**
      - internal/agent/localhttp/**
      - internal/agent/presence/**
      # The notifier's per-OS backends (platform_*.go) and the rules they
      # share.
      - internal/agent/notifier/**
      - internal/agent/keys/**
      # The ledger writer, whose crash loop kills a real writer process 200
      # times, which Windows does with TerminateProcess (PLAN, WP-LG5).
      - internal/agent/ledger/**
      # The git adapter drives the real git CLI and watches .git with file
      # notifications, both of which differ on Windows (PLAN, WP-AD5).
      - internal/adapters/git/**
      - cmd/pairtime/**
      - .github/workflows/platform.yml
      - tools/ci/test_existing.sh
      - tools/ci/desktop_session.sh
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pairtime never uses cgo (AGENTS.md).
  CGO_ENABLED: "0"
  PLATFORM_DIRS: internal/platform internal/install internal/agent/ipc internal/agent/inbox internal/agent/home internal/agent/localhttp internal/agent/presence internal/agent/notifier internal/agent/keys internal/agent/ledger internal/adapters/git cmd/pairtime

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to commit SHAs; tags can be moved. Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: go test (platform packages)
        # Hosted runners get injected fakes, never real focus switching
        # (JE must-fix 11).
        run: bash tools/ci/test_existing.sh -- $PLATFORM_DIRS

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: go test (platform packages)
        env:
          # The macOS tests write what they find about the OS here, such as
          # whether key-down idle needs Input Monitoring (WP-OS3).
          PAIRTIME_FINDINGS_DIR: ${{ runner.temp }}/findings
        # -count=1: these tests read the live OS and write the findings, so a
        # pass cached by an earlier run, which setup-go restores, can't stand
        # in for this one.
        run: bash tools/ci/test_existing.sh -count=1 -- $PLATFORM_DIRS

      - name: Upload the findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-findings
          path: ${{ runner.temp }}/findings/
          if-no-files-found: error
          retention-days: 90

  linux-desktop:
    # Only the Linux tests that need an X server or a session D-Bus: files
    # named *_desktop_test.go, built with -tags desktop (AGENTS.md). Every
    # other Linux test runs in ci.yml.
    name: linux desktop (Xvfb, D-Bus)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find desktop tests
        id: find
        run: |
          dirs=$(git ls-files -- '*_desktop_test.go' | xargs -r -n 1 dirname | sort -u | tr '\n' ' ')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          # A run by hand sets up the desktop even with no tests, to prove
          # the runner image still has what the tests need.
          if [ -n "$dirs" ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "desktop test packages: ${dirs:-none yet}"
          else
            echo "::notice::no *_desktop_test.go files yet, so there is nothing to run"
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.find.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Install Xvfb, openbox, xterm, xdotool and D-Bus
        if: steps.find.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb openbox xterm xdotool x11-utils dbus dbus-bin

      - name: go test -tags desktop, under Xvfb and a private D-Bus
        if: steps.find.outputs.run == 'true'
        env:
          DIRS: ${{ steps.find.outputs.dirs }}
        run: |
          if [ -z "$DIRS" ]; then
            bash tools/ci/desktop_session.sh true
          else
            # -p 1 runs the packages' test binaries one at a time. Tests in
            # several of them start fakenotify or fakesecret, which own
            # org.freedesktop.Notifications or org.freedesktop.secrets on the
            # one private bus, or need nobody to own them.
            bash tools/ci/desktop_session.sh bash tools/ci/test_existing.sh -p 1 -tags desktop -- $DIRS
          fi
