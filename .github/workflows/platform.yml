# SPDX-License-Identifier: AGPL-3.0-or-later
#
# OS-specific client tests. Windows and macOS runners are scarce and shared
# with another busy project, so they run only here, only when platform code
# changes, on release tags and by hand (DESIGN 3.13). Each job tests the
# platform packages, not the whole module: ci.yml already does that on Linux.
# The end-to-end rehearsal, which builds the server too, has a workflow of
# its own, rehearsal.yml, so a server PR runs it without these runners.
name: platform

on:
  pull_request:
    # DESIGN 3.13's paths, plus the files this workflow runs. Keep the code
    # paths in step with PLATFORM_DIRS below.
    paths:
      - internal/platform/**
      - internal/install/**
      - internal/agent/ipc/**
      # The agent's own files, startIPC in messages.go among them. ipc's
      # TestAgentKilledMidStream runs a real agent.Run, and this is where it
      # runs on Windows (socket and pipe) and macOS. It lives in
      # internal/agent/ipc, so PLATFORM_DIRS needn't list these.
      - internal/agent/*.go
      # The agent's platform code: the lock, the data directories and
      # private files (home), the loopback server (localhttp), the spool,
      # which Windows file sharing makes OS-specific (inbox), presence,
      # whose smoke test runs on the real Windows sources, and the device
      # keystore, which picks DPAPI, the Keychain or the Secret Service by
      # OS (keys).
      - internal/agent/inbox/**
      - internal/agent/home/**
      - internal/agent/localhttp/**
      - internal/agent/presence/**
      # The focus component, whose Windows source is the foreground hook in
      # internal/platform/windows (WP-OS2).
      - internal/agent/focus/**
      # The notifier's per-OS backends (platform_*.go) and the rules they
      # share.
      - internal/agent/notifier/**
      - internal/agent/keys/**
      # The ledger writer, whose crash loop kills a real writer process 200
      # times, which Windows does with TerminateProcess (PLAN, WP-LG5).
      - internal/agent/ledger/**
      # The vault, which writes its files again by rename and deletes them,
      # neither of which Windows does to a file a handle has open (WP-LG6).
      - internal/agent/vault/**
      # The hook's fast path reads the process table, the monotonic clock
      # and the boot id per OS (WP-AG3).
      - internal/agent/hookpath/**
      # The git adapter drives the real git CLI and watches .git with file
      # notifications, both of which differ on Windows (PLAN, WP-AD5).
      - internal/adapters/git/**
      # T3 Code's reader runs the sqlite3 tool with the OS's null device for
      # its .sqliterc, at a low priority each OS sets its own way, reads the
      # line ends of its output, and skips a read while a stat of T3's -wal
      # and -shm files shows no change, which each file system times its own
      # way (WP-ADE1). Its tests build T3 stores with sqlite3, which the
      # Windows job installs.
      - internal/adapters/t3code/**
      # doctor reads the OS build, the data folder's disk and the binary's
      # signature through each OS's own calls (WP-AG6).
      - internal/agent/doctor/**
      # The log tailers name a file by its volume and index on Windows and
      # watch files rather than folders on macOS (WP-AD3).
      - internal/agent/tailers/**
      - cmd/pairtime/**
      - .github/workflows/platform.yml
      - tools/ci/test_existing.sh
      - tools/ci/desktop_session.sh
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      capture:
        # iterm2 records internal/agent/focus's golden process table and
        # runs nothing else (the iterm2-capture job):
        #
        #   gh workflow run platform.yml --ref <branch> -f capture=iterm2
        description: "iterm2: only capture the macOS process table for internal/agent/focus's iTerm2 golden test"
        type: choice
        options: [none, iterm2]
        default: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pairtime never uses cgo (AGENTS.md).
  CGO_ENABLED: "0"
  PLATFORM_DIRS: internal/platform internal/install internal/agent/ipc internal/agent/inbox internal/agent/home internal/agent/localhttp internal/agent/presence internal/agent/focus internal/agent/notifier internal/agent/keys internal/agent/ledger internal/agent/vault internal/agent/hookpath internal/adapters/git internal/adapters/t3code internal/agent/doctor internal/agent/tailers cmd/pairtime

jobs:
  windows:
    name: windows
    # inputs is empty outside workflow_dispatch, so every other event runs
    # this job.
    if: inputs.capture != 'iterm2'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to commit SHAs; tags can be moved. Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: sqlite3 for T3 Code's reader's tests
        # internal/adapters/t3code's tests build T3 Code stores with the
        # sqlite3 tool and read them with it, as the reader does (DESIGN
        # 5.1), and fail in CI without it. Windows has none, so this
        # downloads SQLite's own Windows tools from sqlite.org, pinned by
        # SHA-256, as footprint.yml does, and puts their folder first on
        # PATH. That is the real sqlite3.exe, with no shim between: a shim
        # would start sqlite3 as a process of its own, which a run the
        # reader stops at its timeout would leave holding open a store the
        # test's temporary folder can't then remove.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command sqlite3 -ErrorAction SilentlyContinue)) {
            # SQLite's own Windows tools from sqlite.org, pinned by the zip's SHA-256
            # (its SHA3-256 is the one sqlite.org's download page gives).
            $url = 'https://www.sqlite.org/2026/sqlite-tools-win-x64-3540100.zip'
            $sha256 = 'FB20997ADE5583A5FBF1E36DB7BC3C82C9416B3F314F16961E1572AA4E49487D'
            $zip = Join-Path $env:RUNNER_TEMP 'sqlite-tools.zip'
            for ($try = 1; ; $try++) {
              try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing; break }
              catch {
                if ($try -ge 3) { throw "couldn't download SQLite's tools from sqlite.org: $_" }
                Start-Sleep -Seconds (10 * $try)
              }
            }
            if ((Get-FileHash -Path $zip -Algorithm SHA256).Hash -ne $sha256) { throw "SQLite's tools zip from sqlite.org isn't the pinned one" }
            $dir = Join-Path $env:RUNNER_TEMP 'sqlite-tools'
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "$dir;$env:PATH"
          }
          "sqlite3 $(sqlite3 --version) at $((Get-Command sqlite3).Source)"
          # Every query of the reader needs sqlite3's JSON functions.
          $json = "SELECT json('{}');" | sqlite3
          if ($LASTEXITCODE -ne 0 -or $json -ne '{}') { throw "this sqlite3 has no JSON functions, which T3 Code's reader needs" }

      - name: go test (platform packages)
        # Hosted runners get injected fakes, never real focus switching
        # (JE must-fix 11).
        run: bash tools/ci/test_existing.sh -- $PLATFORM_DIRS

  macos:
    name: macos
    if: inputs.capture != 'iterm2'
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: sqlite3 for T3 Code's reader's tests
        # macOS ships /usr/bin/sqlite3, which internal/adapters/t3code's
        # tests find on PATH, build T3 Code stores with and read them with,
        # as the reader does (DESIGN 5.1). They fail in CI without it, and
        # every query of the reader needs its JSON functions.
        run: |
          if ! command -v sqlite3 >/dev/null; then
            echo "::error::there is no sqlite3 on PATH, which T3 Code's reader's tests need"
            exit 1
          fi
          echo "sqlite3 $(sqlite3 --version) at $(command -v sqlite3)"
          if [ "$(echo "SELECT json('{}');" | sqlite3)" != '{}' ]; then
            echo "::error::this sqlite3 has no JSON functions, which T3 Code's reader needs"
            exit 1
          fi

      - name: go test (platform packages)
        env:
          # The macOS tests write what they find about the OS here, such as
          # whether key-down idle needs Input Monitoring (WP-OS3).
          PAIRTIME_FINDINGS_DIR: ${{ runner.temp }}/findings
        # -count=1: these tests read the live OS and write the findings, so a
        # pass cached by an earlier run, which setup-go restores, can't stand
        # in for this one.
        run: bash tools/ci/test_existing.sh -count=1 -- $PLATFORM_DIRS

      - name: Upload the findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-findings
          path: ${{ runner.temp }}/findings/
          if-no-files-found: error
          retention-days: 90

  linux-desktop:
    # Only the Linux tests that need an X server or a session D-Bus: the
    # TestDesktop* tests in *_desktop_test.go files, built with -tags
    # desktop (AGENTS.md). Every other Linux test runs in ci.yml.
    name: linux desktop (Xvfb, D-Bus)
    if: inputs.capture != 'iterm2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR is checked out as its merge commit; depth 2 brings its
          # first parent, the base, to see which files the PR changes.
          fetch-depth: 2

      - name: Find desktop tests
        id: find
        run: |
          # testdata holds separate modules, such as licensecheck's seeded
          # desktop test, which aren't pairtime's to run. rehearsal.yml runs
          # internal/rehearsal's.
          pkgs=$(git ls-files -- '*_desktop_test.go' ':(exclude)testdata/*' ':(exclude)*/testdata/*' ':(exclude)internal/rehearsal/*' | xargs -r -n 1 dirname | sort -u | sed 's|^|./|' | tr '\n' ' ')
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          why=""
          if [ -n "$pkgs" ]; then
            why="desktop test packages: $pkgs"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A run by hand sets up the desktop even with no tests, to prove
            # the runner image still has what the tests need.
            why="no desktop tests yet; a run by hand checks the desktop anyway"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # So does a PR that changes how the desktop is set up, so the
            # version that merges has run.
            changed=$(git diff --name-only HEAD^1 HEAD)
            if grep -qx -e tools/ci/desktop_session.sh -e .github/workflows/platform.yml <<<"$changed"; then
              why="no desktop tests yet; this PR changes desktop_session.sh or platform.yml, so it checks the desktop"
            fi
          fi
          if [ -n "$why" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$why"
          else
            echo "::notice::no *_desktop_test.go files yet, so there is nothing to run"
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.find.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Install Xvfb, openbox, xterm, xdotool and D-Bus
        if: steps.find.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb openbox xterm xdotool x11-utils dbus dbus-bin

      - name: go test -tags desktop -run '^TestDesktop', under Xvfb and a private D-Bus
        if: steps.find.outputs.run == 'true'
        env:
          PKGS: ${{ steps.find.outputs.pkgs }}
        run: |
          if [ -z "$PKGS" ]; then
            bash tools/ci/desktop_session.sh true
          else
            # Only the TestDesktop* tests, and only in the packages with
            # desktop test files, not their subpackages: ci.yml runs the
            # rest. -count=1, because a cached pass says nothing about
            # this runner's desktop. -p 1 runs the packages' test binaries
            # one at a time. Tests in several of them start fakenotify or
            # fakesecret, which own org.freedesktop.Notifications or
            # org.freedesktop.secrets on the one private bus, or need nobody
            # to own them.
            bash tools/ci/desktop_session.sh go test -p 1 -tags desktop -run '^TestDesktop' -count=1 $PKGS
          fi

  iterm2-capture:
    # By hand only, with capture=iterm2 (decision E-6.3-two-tabs). It
    # records the process table that internal/agent/focus's TestITerm2Golden
    # reads in ci.yml: harness stubs in a session of iTerm2, from its
    # Homebrew cask, under an iTermServer that doesn't descend from iTerm2,
    # and in Terminal. TestCaptureITerm2 opens windows and kills and
    # restarts iTerm2, so no check rests on it (JE must-fix 11). Copy the
    # artifact's iterm2-macos-latest.json to internal/agent/focus/testdata/.
    name: iTerm2 capture (macOS)
    if: github.event_name == 'workflow_dispatch' && inputs.capture == 'iterm2'
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Install iTerm2 from its Homebrew cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          brew install --cask iterm2
          # Gatekeeper asks before the first launch of an app downloaded
          # from the internet, and nobody is there to answer.
          xattr -dr com.apple.quarantine /Applications/iTerm.app || true
          plutil -extract CFBundleShortVersionString raw -o - /Applications/iTerm.app/Contents/Info.plist

      - name: go test -run '^TestCaptureITerm2$'
        env:
          PAIRTIME_CAPTURE_ITERM2: ${{ runner.temp }}/iterm2-capture
        run: |
          mkdir -p "$PAIRTIME_CAPTURE_ITERM2"
          go test -count=1 -v -run '^TestCaptureITerm2$' ./internal/agent/focus/

      - name: Upload the capture
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iterm2-capture
          path: ${{ runner.temp }}/iterm2-capture/
          if-no-files-found: error
          retention-days: 90
