# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The web UI and the VS Code extension: npm licenses, npm ci, svelte-check,
# vitest, the real UI build, Playwright on Chromium only against a `pairtime
# agent` built in this job with that UI embedded, and SPDX headers (DESIGN
# 3.13; docs/PLAN.md, WP-UI0). Go-only jobs never need Node, because
# internal/webui embeds a checked-in placeholder (DESIGN 3.12).
name: web

on:
  pull_request:
    # DESIGN 3.13's paths, plus everything the smoke test runs and holds to
    # docs/api: the embedded UI, the local API's spec, and `pairtime agent`,
    # whose answers take their shape from code across internal/agent (the
    # ipc object comes from messages.go, the mode from config/), the build
    # info in internal/version and the command in cmd/pairtime.
    paths:
      - web/**
      - extension/**
      - internal/webui/**
      - docs/api/**
      - internal/agent/**
      - internal/version/**
      - cmd/pairtime/**
      - tools/ci/npm_licenses.py
      - .github/workflows/web.yml
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: npm ci, vitest, build, Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to commit SHAs; tags can be moved. Dependabot bumps them.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: npm licenses
        # From the lockfiles alone, before anything is installed. Lockfiles
        # come from tidy.yml (docs/PLAN.md, ground rule 3).
        run: |
          python3 -I tools/ci/npm_licenses.py selftest
          locks=$(git ls-files -- 'web/package-lock.json' 'extension/*/package-lock.json')
          if [ -n "$locks" ]; then
            python3 -I tools/ci/npm_licenses.py $locks
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        id: install
        working-directory: web
        # No package needs an install script on Linux; fsevents, the only
        # one with a script, is macOS-only.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Types from docs/api, and svelte-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: web
        run: npm run check

      - name: vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: web
        run: npm run test:unit

      - name: Build the UI
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: web
        run: |
          npm run build
          # The local dashboard replaced internal/webui's placeholder.
          grep -q '<meta name="pairtime-ui" content="local"' ../internal/webui/dist/index.html
          # Old laptops load this on every visit (CP 1.5). Raise the budget
          # on purpose, in the PR that needs it, never by accident.
          budget=262144
          size=$(find ../internal/webui/dist -type f -printf '%s\n' | awk '{ s += $1 } END { print s + 0 }')
          echo "local dashboard: $size bytes in $(find ../internal/webui/dist -type f | wc -l) files (budget $budget)"
          find ../internal/webui/dist -type f -printf '  %8s  %P\n' | sort -k2
          if [ "$size" -gt "$budget" ]; then
            echo "::error::the local dashboard is $size bytes, over its $budget-byte budget"
            exit 1
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: The agent, with the real UI embedded
        id: agent
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # internal/webui's tests run again here, on the real build.
          go test ./internal/webui/
          go build -trimpath -o "$RUNNER_TEMP/pairtime" ./cmd/pairtime
          echo "PAIRTIME_BIN=$RUNNER_TEMP/pairtime" >> "$GITHUB_ENV"

      - name: Playwright (Chromium only)
        if: ${{ !cancelled() && steps.agent.outcome == 'success' }}
        working-directory: web
        run: |
          ./node_modules/.bin/playwright install --with-deps --only-shell chromium
          ./node_modules/.bin/playwright test --project=chromium

      # Screenshots of the components and the dashboard for review
      # (tests/screens.spec.ts).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.agent.outcome == 'success' }}
        with:
          name: screens
          path: web/screens/
          retention-days: 7
          if-no-files-found: ignore

      - name: SPDX headers
        # AGENTS.md's rule for web files. An .html file starts with
        # <!doctype html>, which TestFS needs the built page to start with,
        # so its SPDX comment is line 2. This runs whatever failed above,
        # and reads each file as committed, from git's index, because the
        # build above wrote over internal/webui/dist/index.html.
        if: ${{ !cancelled() }}
        run: |
          spdx="SPDX-License-Identifier: AGPL-3.0-or-later"
          file=$RUNNER_TEMP/spdx-check
          fail=0
          while IFS= read -r f; do
            git show ":$f" > "$file"
            line=1
            case "$f" in
              *.ts | *.js) want="// $spdx" ;;
              *.svelte) want="<!-- $spdx -->" ;;
              *.css) want="/* $spdx */" ;;
              *.html)
                want="<!-- $spdx -->"
                line=2
                if [ "$(sed -n 1p "$file" | tr '[:upper:]' '[:lower:]')" != "<!doctype html>" ]; then
                  echo "::error file=$f,line=1::line 1 must be: <!doctype html>"
                  fail=1
                fi
                ;;
            esac
            if [ "$(sed -n "${line}p" "$file")" != "$want" ]; then
              echo "::error file=$f,line=$line::line $line must be: $want"
              fail=1
            fi
          done < <(git ls-files -- 'web/*.ts' 'web/*.js' 'web/*.svelte' 'web/*.css' 'web/*.html' 'internal/webui/dist/*.html')
          exit "$fail"

      - name: Other npm projects (extension/)
        if: ${{ !cancelled() }}
        run: |
          dirs=$(git ls-files -- 'extension/*/package.json' | xargs -r -n 1 dirname)
          if [ -z "$dirs" ]; then
            echo "no package.json under extension/ yet"
            exit 0
          fi
          for dir in $dirs; do
            echo "::group::$dir"
            (cd "$dir" && npm ci --ignore-scripts && npm test --if-present && npm run build --if-present)
            echo "::endgroup::"
          done
