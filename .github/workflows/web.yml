#
# The web UI and the VS Code extension: npm ci, vitest, the real UI build and
# Playwright on Chromium only (DESIGN 3.13). Go-only jobs never need Node,
# because internal/webui embeds a checked-in placeholder (DESIGN 3.12). Until
# web/ or extension/ has a package.json, this does nothing.
name: web

on:
  pull_request:
    # DESIGN 3.13's paths, plus this file.
    paths:
      - web/**
      - extension/**
      - .github/workflows/web.yml
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: npm ci, vitest, build, Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to commit SHAs; tags can be moved. Dependabot bumps them.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Find npm projects
        id: find
        run: |
          dirs=$(git ls-files -- 'web/package.json' 'extension/*/package.json' | xargs -r -n 1 dirname | tr '\n' ' ')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          if [ -z "$dirs" ]; then
            echo "::notice::no package.json under web/ or extension/ yet, so there is nothing to build"
          else
            echo "npm projects: $dirs"
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.find.outputs.dirs != ''
        with:
          node-version: 24

      - name: npm ci, vitest, build
        if: steps.find.outputs.dirs != ''
        env:
          DIRS: ${{ steps.find.outputs.dirs }}
        run: |
          # Lockfiles come from tidy.yml (docs/PLAN.md, ground rule 3).
          for dir in $DIRS; do
            echo "::group::$dir"
            (cd "$dir" && npm ci && npm test --if-present && npm run build --if-present)
            echo "::endgroup::"
          done

      - name: Playwright (Chromium only)
        if: steps.find.outputs.dirs != '' && (hashFiles('web/playwright.config.*') != '')
        working-directory: web
        run: |
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test --project=chromium
