# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Throwaway probe for PR #37 (WP-OS7): one Linux job that vets the keystore
# for linux, windows and darwin, tests it with and without -race, and runs
# the desktop tests under a private D-Bus. Lives only on wp-os7-probe.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: lint, test, cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      PKGS: ./internal/agent/keys/... ./internal/platform/...
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: gofmt and license headers
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          header="// SPDX-License-Identifier: AGPL-3.0-or-later"
          fail=0
          while IFS= read -r f; do
            [ "$(head -n 1 "$f")" = "$header" ] || { echo "::error file=$f::bad header"; fail=1; }
          done < <(git ls-files '*.go')
          exit "$fail"

      - name: go vet, linux
        if: ${{ !cancelled() }}
        run: go vet ./... && go vet -tags desktop $PKGS

      - name: go vet, windows
        if: ${{ !cancelled() }}
        run: GOOS=windows go vet $PKGS

      - name: go vet, darwin
        if: ${{ !cancelled() }}
        run: GOOS=darwin go vet $PKGS

      - name: go test
        if: ${{ !cancelled() }}
        run: go test -count=1 $PKGS

      - name: go test -race
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./internal/agent/keys/...

      - name: go test -tags desktop under a private D-Bus
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dbus dbus-bin
          dbus-run-session -- go test -count=1 -p 1 -tags desktop -v -run 'TestSecretService|TestThisOSStore|TestVectorsThroughThisOSStore' ./internal/agent/keys/... ./internal/platform/linux/... 2>&1 | tail -80
          exit "${PIPESTATUS[0]}"

      - name: go test -tags desktop, two packages side by side (fakesecret waits for the name)
        if: ${{ !cancelled() }}
        run: dbus-run-session -- go test -count=1 -tags desktop ./internal/agent/keys/... ./internal/platform/linux/...
