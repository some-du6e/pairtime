# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Every PR's build and tests. One Linux job on purpose: the account's Actions
# capacity is shared with another busy project, so new Linux checks join this
# job as steps (DESIGN 3.13). The other workflows are path-filtered or manual;
# AGENTS.md lists them.
name: ci

on:
  pull_request:
    # labeled and unlabeled rerun the job when Karim or the orchestrator adds
    # or removes the oracle-change label, which the oracle guard reads.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint, test, cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # pairtime never uses cgo (AGENTS.md). Vet, test and build all run
      # without it, the same way the shipped binaries are built.
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to commit SHAs; tags can be moved. Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR is checked out as its merge commit; depth 2 brings its first
          # parent, the base, for the oracle guard's diff.
          fetch-depth: 2

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # Key the module and build cache on both files: go.sum alone
          # misses a change only go.mod shows, such as a replace directive.
          cache-dependency-path: |
            go.mod
            go.sum

      - name: License gate
        run: |
          fail=0
          if ! head -n 2 LICENSE | grep -q "GNU AFFERO GENERAL PUBLIC LICENSE"; then
            echo "::error file=LICENSE::LICENSE is not the GNU AGPL text"
            fail=1
          fi
          header="// SPDX-License-Identifier: AGPL-3.0-or-later"
          while IFS= read -r f; do
            if [ "$(head -n 1 "$f")" != "$header" ]; then
              echo "::error file=$f,line=1::first line must be: $header"
              fail=1
            fi
          done < <(git ls-files '*.go')
          exit "$fail"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            while IFS= read -r f; do
              echo "::error file=$f::not gofmt-formatted; run gofmt -w $f"
            done <<< "$unformatted"
            exit 1
          fi

      # The ledger's byte format is docs/spec/ledger-v1.md. This checks the
      # stdlib-only Python reference against the RFC 5869, RFC 4231 and pinned
      # Certificate Transparency vectors, and checks that
      # testdata/ledger/vectors.json regenerates byte for byte.
      - name: Ledger reference selftest
        run: python3 -I tools/ledger_ref.py selftest

      - name: Upstream captures
        # testdata/upstream: each capture's PROVENANCE.md, every JSON file
        # against the schema next to it, and Robert's webhook vectors
        # (testdata/upstream/README.md). Standard library only.
        if: ${{ !cancelled() }}
        run: python3 -I testdata/upstream/check.py

      # pkg/redact embeds gitleaks' rules as JSON converted from the pinned
      # upstream config in pkg/redact/rules. This fails when the JSON isn't
      # exactly what the converter writes from that config.
      - name: Redaction rules
        run: python3 -I pkg/redact/rules/convert.py --check

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: IPC against a second user, as root
        if: ${{ !cancelled() }}
        # The agent's socket must refuse another uid (docs/PLAN.md, WP-AG2).
        # Acting as a second user takes root, so go test skips TestOtherUser,
        # and this step runs it with sudo; it runs its second user as nobody.
        run: |
          go test -c -o "$RUNNER_TEMP/ipc.test" ./internal/agent/ipc
          set +e
          out=$(sudo "$RUNNER_TEMP/ipc.test" -test.run '^TestOtherUser$' -test.count=1 -test.v 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          # A skip would pass without checking anything.
          if ! grep -q '^--- PASS: TestOtherUser ' <<<"$out"; then
            echo "::error::TestOtherUser didn't run as root"
            exit 1
          fi

      - name: Cross-compile
        run: |
          # Targets from docs/research/client-platform.md section 7. windows/386
          # stays in while its open question 2 (do 32-bit machines exist?) is open.
          targets="windows/amd64 windows/386 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64"
          # Client binary budget: under 15 MB, client-platform.md sections 7 and 9.
          budget=15000000

          pkg=github.com/some-du6e/pairtime/internal/version
          commit=$(git rev-parse HEAD)
          date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
          ldflags="-s -w -X $pkg.Version=v0.0.0-ci -X $pkg.Commit=$commit -X $pkg.Date=$date"
          # Outside the checkout, so the build's VCS stamp doesn't see the
          # binaries as uncommitted changes.
          dist="$RUNNER_TEMP/dist"

          {
            echo "### Binary sizes (stripped, CGO_ENABLED=0)"
            echo
            echo "| target | binary | bytes |"
            echo "|---|---|---:|"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          for target in $targets; do
            goos=${target%/*}
            goarch=${target#*/}
            ext=""
            if [ "$goos" = windows ]; then ext=".exe"; fi
            for cmd in pairtime pairtimed; do
              out="$dist/${goos}_${goarch}/$cmd$ext"
              # -buildvcs=false: the -X values must supply commit and date,
              # so a flag that stops applying shows up as an empty field.
              GOOS=$goos GOARCH=$goarch go build -trimpath -buildvcs=false -ldflags="$ldflags" -o "$out" "./cmd/$cmd"
              size=$(stat -c %s "$out")
              printf '%-14s %-10s %10d bytes\n' "$target" "$cmd" "$size"
              echo "| $target | $cmd | $size |" >> "$GITHUB_STEP_SUMMARY"
              if [ "$cmd" = pairtime ] && [ "$size" -gt "$budget" ]; then
                echo "::error::$target $cmd is $size bytes, over the $budget-byte client budget"
                fail=1
              fi
            done
          done

          # The runner is linux/amd64, so those binaries can run here. This
          # catches a -X path that no longer matches the version package,
          # which the linker would otherwise ignore without a word.
          for cmd in pairtime pairtimed; do
            got=$("$dist/linux_amd64/$cmd" version)
            echo "$got"
            case "$got" in
              "$cmd v0.0.0-ci (commit ${commit:0:12}, $date, "*) ;;
              *)
                echo "::error::$cmd version didn't report the -ldflags values"
                fail=1
                ;;
            esac
          done
          exit "$fail"

      - name: Third-party notices
        # release.yml packs each binary with the THIRD_PARTY_NOTICES.txt that
        # tools/release notices writes from the modules it links
        # (docs/spec/update-manifest.md). Writing them for all fourteen
        # binaries above, the server's included, makes a module whose
        # license files can't be found fail the PR that adds it, not a tag.
        run: |
          tool="$RUNNER_TEMP/release-tool"
          go build -o "$tool" ./tools/release
          for bin in "$RUNNER_TEMP"/dist/*/*; do
            target=${bin%/*}
            target=${target##*/}
            name=${bin##*/}
            mkdir -p "$RUNNER_TEMP/notices/$target"
            "$tool" notices -bin "$bin" -out "$RUNNER_TEMP/notices/$target/${name%.exe}.txt"
          done

      # The checks below run even when an earlier step failed, so one run
      # reports every problem.

      - name: Platform packages for every target
        # The cross-compile above builds only what cmd/pairtime imports, and
        # platform code lands before the agent calls it. go vet type-checks a
        # package and its tests for one GOOS/GOARCH, so this compiles
        # internal/platform for all seven targets with CGO_ENABLED=0, such as
        # internal/platform/darwin for darwin/amd64 and darwin/arm64 (WP-OS3),
        # the procs scan's per-OS readers (WP-OS6), and the device keystore,
        # which picks its store by OS (WP-OS7). The desktop tests, which build
        # with -tags desktop on Linux alone, are vetted in the Desktop test
        # files step. The Windows and macOS tests themselves run in
        # platform.yml.
        if: ${{ !cancelled() }}
        run: |
          for target in windows/amd64 windows/386 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            echo "go vet ./internal/platform/... ./internal/agent/procs/... ./internal/agent/keys/... for $target"
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./internal/platform/... ./internal/agent/procs/... ./internal/agent/keys/...
          done

      - name: HCA sign-in against an independent OIDC server
        if: ${{ !cancelled() }}
        # WP-SV2's oracle: pairtimed's Hack Club Auth sign-in, end to end
        # against navikt/mock-oauth2-server (MIT), an OIDC server nobody on
        # this project wrote, pinned by digest. Its config gives each client
        # id the claims one case of TestMockOAuth2Server needs. The test
        # skips without PAIRTIME_TEST_OIDC_URL, so this step fails unless it
        # ran and passed.
        env:
          PAIRTIME_TEST_OIDC_URL: http://localhost:8080
          # 6.1.4, 2026-10-28.
          IMAGE: ghcr.io/navikt/mock-oauth2-server:6.1.4@sha256:647dd8c78a54f0e6fcd58d79c884e612f8f998a0662276f3e1db22e464a50192
        run: |
          docker run -d --name oidc -p 8080:8080 \
            -e JSON_CONFIG_PATH=/config/mock-oauth2-server.json \
            -v "$PWD/internal/server/auth/testdata:/config:ro" \
            "$IMAGE" >/dev/null
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/isalive >/dev/null 2>&1; then break; fi
            sleep 1
          done
          set +e
          out=$(go test -count=1 -v -run '^TestMockOAuth2Server$' ./internal/server/auth 2>&1)
          code=$?
          set -e
          grep -E -- '--- (PASS|FAIL|SKIP)' <<<"$out" || true
          if [ "$code" -ne 0 ] || ! grep -q -- '--- PASS: TestMockOAuth2Server ' <<<"$out" || grep -q -- '--- SKIP' <<<"$out"; then
            echo "$out"
            echo "::group::mock-oauth2-server log"
            docker logs oidc 2>&1 | tail -n 200
            echo "::endgroup::"
            echo "::error::TestMockOAuth2Server didn't run and pass against mock-oauth2-server"
            exit 1
          fi

      - name: Module licenses
        if: ${{ !cancelled() }}
        run: |
          # Every module pairtime's packages and tests import, for each of
          # the seven targets above, for the desktop tests and for
          # nightly.yml's -race run, must be MIT, BSD-2-Clause, BSD-3-Clause,
          # Apache-2.0 or ISC (DESIGN 3.12). licensecheck exits 1 on a bad
          # license.
          tool="$RUNNER_TEMP/licensecheck"
          go build -o "$tool" ./tools/ci/licensecheck
          "$tool"

          # The check must keep catching a GPL-3.0 module pulled in through a
          # replace, whether a package imports it (bad), only a desktop test
          # does (desktop) or only a race-tagged test does (race), and keep
          # passing an MIT one (testdata/licensecheck).
          "$tool" -C testdata/licensecheck/good
          for seeded in bad desktop race; do
            set +e
            out=$("$tool" -C "testdata/licensecheck/$seeded" 2>&1)
            code=$?
            set -e
            # Rewritten, so the expected errors don't become PR annotations:
            # the runner reads ::error:: even after leading spaces.
            sed 's/^::error::/expected error: /' <<<"$out"
            if [ "$code" -ne 1 ] || ! grep -q '^::error::example.com/licensecheck/gpl@v0.0.0 => ../gpl: LICENSE:' <<<"$out"; then
              echo "::error::licensecheck no longer rejects the GPL-3.0 module seeded in testdata/licensecheck/$seeded (exit $code)"
              exit 1
            fi
            echo "the GPL-3.0 module seeded in $seeded was rejected, as it should be"
          done

      - name: Fixture provenance
        if: ${{ !cancelled() }}
        # Every testdata/fixtures/<harness>/<version>/<os>/ directory has a
        # PROVENANCE.md (DESIGN 5.1). fixtures.yml runs the same check by hand.
        run: go run ./tools/ci/provenance testdata/fixtures

      - name: Shell scripts
        if: ${{ !cancelled() }}
        run: |
          # shellcheck comes with the runner image.
          scripts=$(git ls-files -- '*.sh')
          if [ -n "$scripts" ]; then
            shellcheck $scripts
          fi

      - name: Desktop test files
        if: ${{ !cancelled() }}
        # platform.yml's Linux job finds desktop tests by file name,
        # *_desktop_test.go, and runs only their TestDesktop* functions with
        # -tags desktop, while go vet and go test above build without the
        # tag (AGENTS.md). So a test function in a file that builds on Linux
        # only with the tag but has another name, or one in a desktop test
        # file that isn't named TestDesktop*, would never run anywhere. A
        # *_desktop_test.go file without the desktop build line would run in
        # go test above, with no X server or session bus. And since nothing
        # else here compiles the desktop test files, the step vets them.
        run: |
          export LC_ALL=C
          fail=0
          funcs='^func (Test|Example|Benchmark|Fuzz)[^a-z]'
          # Each search below may find nothing (exit 1); anything else that
          # fails stops the step.

          # Which files a build includes is the go command's call: build
          # lines such as !(linux && desktop) or darwin || (linux &&
          # desktop) don't yield to a pattern. These are the test files
          # that build on Linux only with -tags desktop.
          testfiles() {
            go list "$@" -f '{{$d := .Dir}}{{range .TestGoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}{{range .XTestGoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}' ./... | sed "s|^$PWD/||" | sort
          }
          plain=$(testfiles)
          tagged=$(testfiles -tags desktop)
          only_desktop=$(comm -13 <(printf '%s\n' "$plain") <(printf '%s\n' "$tagged"))
          # Printed, so the log shows the check had files to look at.
          echo "Test files that build on Linux only with -tags desktop:"
          sed 's/^/  /' <<<"$only_desktop"
          while IFS= read -r f; do
            case "$f" in "" | *_desktop_test.go) continue ;; esac
            # A file of helpers, such as one shared with darwin, is fine.
            hits=$(grep -n -E "$funcs" "$f") || [ $? -eq 1 ]
            while IFS=: read -r line text; do
              [ -n "$line" ] || continue
              echo "::error file=$f,line=$line::$text builds on Linux only with -tags desktop, but platform.yml runs desktop tests only from *_desktop_test.go files. Move it into one (AGENTS.md)."
              fail=1
            done <<<"$hits"
          done <<<"$only_desktop"

          untagged=$(git grep -L -E '^//go:build linux && desktop$' -- '*_desktop_test.go') || [ $? -eq 1 ]
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "::error file=$f::a desktop test file needs the build line //go:build linux && desktop, or go test above runs it with no X server or session bus (AGENTS.md)."
            fail=1
          done <<<"$untagged"

          named=$(git grep -n -E "$funcs" -- '*_desktop_test.go') || [ $? -eq 1 ]
          bad=$(printf '%s\n' "$named" | grep -v -E '^[^:]+:[0-9]+:func (TestDesktop|TestMain\()') || [ $? -eq 1 ]
          while IFS=: read -r file line text; do
            [ -n "$file" ] || continue
            echo "::error file=$file,line=$line::$text is in a desktop test file, where platform.yml runs only TestDesktop* functions. Give it a name that starts with TestDesktop, or move it to a plain _test.go file (AGENTS.md)."
            fail=1
          done <<<"$bad"

          # Type-checks the desktop test files and what only they import,
          # such as godbus's prop package, on every PR, with no X server.
          echo "go vet -tags desktop ./..."
          go vet -tags desktop ./... || fail=1
          exit "$fail"

      - name: Oracle guard
        # A PR may not change an existing oracle together with the code it
        # checks, unless Karim or the orchestrator adds the oracle-change label to
        # apply a decision made outside the PR (AGENTS.md; docs/PLAN.md, ground
        # rule 5). The labels come from the event payload.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git -c core.quotePath=false diff --name-status -M HEAD^1 HEAD | bash tools/ci/oracle_guard.sh
